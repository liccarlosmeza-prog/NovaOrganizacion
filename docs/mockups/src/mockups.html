<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaOrganización — Conceptos</title>
<style>
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f8fafc; --border:#e2e8f0; --border-2:#edf1f6;
  --text:#0f1b2d; --muted:#5b6b80; --subtle:#8a97a8;
  --primary:#2563eb; --primary-600:#1d4ed8; --primary-50:#eef4ff; --primary-100:#dbe7ff;
  --nav:#0f172a; --nav-2:#1e293b; --nav-text:#cbd5e1;
  --trabajo:#2563eb; --trabajo-bg:#e8f0fe;
  --escuela:#7c3aed; --escuela-bg:#f1ebfe;
  --personal:#0d9488; --personal-bg:#e3f6f3;
  --teams:#5b5fc7; --teams-bg:#ecedfb;
  --ok:#16a34a; --ok-bg:#e7f6ec; --warn:#d97706; --warn-bg:#fdf3e2; --danger:#dc2626; --danger-bg:#fdecec;
  --radius:12px; --shadow:0 1px 2px rgba(15,27,45,.05),0 1px 3px rgba(15,27,45,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
svg.i{width:16px;height:16px;stroke-width:2;flex:none}
.app{display:grid;grid-template-columns:228px 1fr;width:1440px;height:900px;overflow:hidden}
/* Sidebar */
.side{background:var(--nav);color:var(--nav-text);display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;color:#fff;font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#6366f1);display:grid;place-items:center}
.brand small{display:block;font-weight:500;font-size:11px;color:#94a3b8;letter-spacing:0}
.nav-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--nav-text);text-decoration:none;font-weight:500;margin-bottom:2px}
.nav a.on{background:var(--nav-2);color:#fff;box-shadow:inset 3px 0 0 #3b82f6}
.nav a .cnt{margin-left:auto;font-size:11px;background:#334155;color:#e2e8f0;border-radius:10px;padding:0 7px}
.side .foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid #1e293b}
.avatar{width:30px;height:30px;border-radius:50%;background:#334155;color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
.side .foot b{color:#fff;font-weight:600;display:block;font-size:12.5px}
.side .foot span{font-size:11px;color:#94a3b8}
/* Main */
.main{display:flex;flex-direction:column;overflow:hidden}
.top{height:64px;flex:none;display:flex;align-items:center;gap:14px;padding:0 28px;background:var(--surface);border-bottom:1px solid var(--border)}
.top h1{font-size:18px;font-weight:700;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:12.5px;margin-left:2px}
.search{white-space:nowrap;overflow:hidden;margin-left:auto;display:flex;align-items:center;gap:8px;width:300px;height:36px;border:1px solid var(--border);border-radius:9px;padding:0 12px;color:var(--subtle);background:var(--surface-2)}
.kbd{white-space:nowrap;margin-left:auto;font-size:10.5px;border:1px solid var(--border);border-radius:5px;padding:0 5px;color:var(--muted);background:#fff}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;font-weight:600;font-size:12.5px;border:1px solid var(--border);background:#fff;color:var(--text);white-space:nowrap}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);display:grid;place-items:center;color:var(--muted);background:#fff;position:relative}
.dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:2px solid #fff}
.content{flex:1;padding:22px 28px;overflow:hidden}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;font-weight:650;font-size:13px}
.card-h .i{color:var(--muted)}
.card-h .act{margin-left:auto;font-weight:500;color:var(--primary);font-size:12px}
.card-b{padding:0 16px 14px}
.muted{color:var(--muted)} .subtle{color:var(--subtle)}
.badge{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap}
.b-trabajo{background:var(--trabajo-bg);color:var(--trabajo)} .b-escuela{background:var(--escuela-bg);color:var(--escuela)}
.b-personal{background:var(--personal-bg);color:var(--personal)} .b-teams{background:var(--teams-bg);color:var(--teams)}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)} .b-danger{background:var(--danger-bg);color:var(--danger)}
.b-gray{background:#eef2f7;color:#475569} .b-blue{background:var(--primary-50);color:var(--primary)}
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.bar{height:6px;border-radius:4px;background:#e9eef5;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:4px;background:var(--primary)}
.chk{width:17px;height:17px;border-radius:5px;border:1.6px solid #b8c3d1;display:grid;place-items:center;flex:none;background:#fff}
.chk.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chk.on svg{width:12px;height:12px;stroke-width:3}
.row{display:flex;align-items:center;gap:10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border)}
.tabs a{padding:10px 14px;font-weight:600;color:var(--muted);display:flex;gap:7px;align-items:center;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--primary);border-color:var(--primary)}
.tabs a .c{font-size:11px;background:#eef2f7;color:#475569;border-radius:10px;padding:0 6px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:#fff}
.seg a{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;font-weight:600;font-size:12px;color:var(--muted);border-right:1px solid var(--border)}
.seg a:last-child{border-right:0} .seg a.on{background:var(--primary-50);color:var(--primary)}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px solid var(--border);border-radius:16px;font-weight:500;font-size:12px;background:#fff;color:var(--text)}
.chip.on{border-color:var(--primary);background:var(--primary-50);color:var(--primary);font-weight:600}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.img{border-radius:9px;position:relative;overflow:hidden;display:grid;place-items:center;color:rgba(255,255,255,.85)}
.img svg{width:22px;height:22px}
.g1{background:linear-gradient(135deg,#93c5fd,#3b82f6)} .g2{background:linear-gradient(135deg,#c4b5fd,#7c3aed)}
.g3{background:linear-gradient(135deg,#99f6e4,#0d9488)} .g4{background:linear-gradient(135deg,#fde68a,#f59e0b)}
.g5{background:linear-gradient(135deg,#e2e8f0,#94a3b8)} .g6{background:linear-gradient(135deg,#fecaca,#ef4444)}
.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--subtle)}
.kpi{padding:14px 16px}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.kpi .d{font-size:11.5px;color:var(--muted);margin-top:2px}
.list-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border-2)}
.list-item:first-child{border-top:0}
.screen{display:none}
.screen.show{display:block}
</style>
</head>
<body>
<div id="root"></div>
<script>
const ICONS = /*ICONS*/{};
const ic = (n, cls='') => (ICONS[n]||ICONS['circle']).replace('<svg', `<svg class="i ${cls}"`);

const NAV = [
  ['hoy','sun','Hoy'],['proyectos','folder-kanban','Proyectos',8],['tareas','list-checks','Tareas',14],
  ['agenda','calendar-days','Agenda'],['carga','flame','Carga de trabajo'],['notas','lightbulb','Notas e ideas'],
  ['cumple','cake','Cumpleaños',2]
];
function shell(active, title, sub, body, extraTop=''){
  return `<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">${ic('sparkles')}</div><div>NovaOrganización<small>Proyectos · Agenda · Ideas</small></div></div>
    <nav class="nav">
      <div class="nav-sec">Espacio</div>
      ${NAV.map(([k,i,t,c])=>`<a class="${k===active?'on':''}">${ic(i)}${t}${c?`<span class="cnt">${c}</span>`:''}</a>`).join('')}
      <div class="nav-sec">Ámbitos</div>
      <a><span class="sdot" style="background:var(--trabajo)"></span>Trabajo<span class="cnt">3</span></a>
      <a><span class="sdot" style="background:var(--escuela)"></span>Escuela<span class="cnt">3</span></a>
      <a><span class="sdot" style="background:var(--personal)"></span>Personal<span class="cnt">2</span></a>
      <div class="nav-sec">Sistema</div>
      <a class="${active==='ajustes'?'on':''}">${ic('settings')}Ajustes</a>
    </nav>
    <div class="foot"><div class="avatar">CM</div><div><b>Carlos</b><span>Sincronizado · local</span></div></div>
  </aside>
  <main class="main">
    <header class="top">
      <div><h1>${title}</h1></div><div class="sub">${sub}</div>
      <div class="search">${ic('search')}Buscar proyectos, notas, tareas…<span class="kbd">Ctrl K</span></div>
      ${extraTop}
      <div class="icon-btn">${ic('bell')}<span class="dot"></span></div>
      <button class="btn pri">${ic('plus')}Nuevo</button>
    </header>
    <section class="content">${body}</section>
  </main></div>`;
}
const amb = a => `<span class="badge b-${a.toLowerCase()}">${a}</span>`;

/* ---------------- HOY ---------------- */
function hoy(){
  const agenda = [
    ['08:30','09:00','Daily del equipo','Teams','teams','video'],
    ['10:00','11:00','Revisión: App Mi Comunidad Los Robles','Revisión de proyecto','trabajo','flag'],
    ['13:00','14:00','Comida con proveedor','Outlook','teams','map-pin'],
    ['16:00','16:30','Sesión 1:1 con jefe directo','Teams','teams','video'],
    ['19:00','21:00','Clase: Bases de Datos II','Escuela · Aula virtual','escuela','graduation-cap'],
  ];
  const now = 2; // index highlight
  const pend = [
    [false,'Entregar Actividad 3 — Modelo E-R','Bases de Datos II','escuela','Hoy 23:59','b-warn'],
    [false,'Revisar consultas SQL de tesorería','App Mi Comunidad','trabajo','Hoy','b-warn'],
    [true,'Enviar minuta de la revisión semanal','Reportes Power BI','trabajo','Hoy','b-ok'],
    [false,'Lectura: Patrones de arquitectura cap. 4','Arquitectura de Software','escuela','Vencida ayer','b-danger'],
    [false,'Comprar regalo para Ana','Personal','personal','Mañana','b-gray'],
  ];
  const proys = [
    ['App Mi Comunidad Los Robles','Trabajo','En revisión','b-blue',78,'Revisión hoy 10:00'],
    ['Proyecto final: Sistema de inventario','Escuela','En curso','b-ok',42,'Entrega 28 nov'],
    ['Dashboard de indicadores Power BI','Trabajo','En curso','b-ok',61,'Siguiente revisión vie'],
    ['Orquestación de agentes IA (Hermes)','Personal','Idea → Plan','b-gray',15,'Sin fecha'],
  ];
  const week = [['L',3.5],['M',6],['X',8.5],['J',11],['V',4],['S',2],['D',0.5]];
  const max = 12;
  const heat = h => h>=9?'#ef4444':h>=6?'#f59e0b':h>=3?'#3b82f6':'#93c5fd';
  return shell('hoy','Buenos días, Carlos','Miércoles 11 de noviembre, 2026', `
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px">
    ${[['calendar-days','Eventos hoy','5','2 de Teams · 1 revisión'],['list-checks','Pendientes hoy','4','1 vencida'],['folder-kanban','Proyectos activos','8','2 en revisión'],['flame','Carga de hoy','8.5 h','Alta · día más cargado: jueves']]
      .map(([i,t,v,d],k)=>`<div class="card kpi"><div class="row label">${ic(i)}${t}</div><div class="v" style="${k===3?'color:var(--warn)':''}">${v}</div><div class="d">${d}</div></div>`).join('')}
  </div>
  <div style="display:grid;grid-template-columns:1.15fr 1.1fr .8fr;gap:14px;margin-bottom:14px">
    <div class="card">
      <div class="card-h">${ic('calendar-days')}Agenda de hoy<span class="badge b-teams" style="margin-left:6px">${ic('refresh-cw')}Teams sincronizado 08:05</span><span class="act">Ver agenda</span></div>
      <div class="card-b">
        ${agenda.map(([a,b,t,s,c,i],k)=>`
        <div class="row" style="padding:7px 8px;border-radius:9px;${k===now?'background:var(--primary-50);':''}">
          <div style="width:74px;font-weight:600;font-size:12px">${a}<div class="subtle" style="font-weight:500">${b}</div></div>
          <div style="width:3px;height:34px;border-radius:2px;background:var(--${c})"></div>
          <div style="flex:1;min-width:0"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t}</div><div class="row muted" style="gap:5px;font-size:11.5px">${ic(i,'')}${s}</div></div>
          ${k===now?'<span class="badge b-blue">Siguiente</span>':''}
        </div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-h">${ic('list-checks')}Pendientes<span class="act">Ver todas</span></div>
      <div class="card-b">
        ${pend.map(([d,t,p,a,f,b])=>`<div class="list-item">
          <span class="chk ${d?'on':''}">${d?ic('check'):''}</span>
          <div style="flex:1;min-width:0"><div style="font-weight:550;${d?'text-decoration:line-through;color:var(--subtle)':''}">${t}</div>
          <div class="row" style="gap:6px;font-size:11.5px"><span class="sdot" style="background:var(--${a})"></span><span class="muted">${p}</span></div></div>
          <span class="badge ${b}">${f}</span></div>`).join('')}
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="card">
        <div class="card-h">${ic('cake')}Cumpleaños<span class="act">Todos</span></div>
        <div class="card-b">
          ${[['AR','Ana Ramírez','Hoy · cumple 30','#f43f5e',true],['LM','Luis Mendoza','Domingo 15 nov','#0ea5e9'],['PG','Mamá','2 de diciembre','#a855f7']].map(([ini,n,f,c,h])=>`
          <div class="list-item"><div class="avatar" style="background:${c};width:32px;height:32px">${ini}</div><div style="flex:1"><div style="font-weight:600">${n}</div><div class="muted" style="font-size:11.5px">${f}</div></div>${h?`<span class="badge b-danger">${ic('gift')}Hoy</span>`:''}</div>`).join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-h">${ic('flag')}Próximas revisiones</div>
        <div class="card-b">
          ${[['Hoy 10:00','App Mi Comunidad'],['Vie 13 · 12:00','Dashboard Power BI'],['Lun 16 · 18:00','Asesoría proyecto final']].map(([f,p])=>`<div class="list-item"><span class="sdot" style="background:var(--primary)"></span><div style="flex:1;font-weight:550">${p}</div><span class="muted" style="font-size:11.5px">${f}</span></div>`).join('')}
        </div>
      </div>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:2fr 1fr;gap:14px">
    <div class="card">
      <div class="card-h">${ic('folder-kanban')}Proyectos activos
        <div class="row" style="margin-left:12px;gap:6px"><span class="chip on" style="height:24px">Todos</span><span class="chip" style="height:24px">Trabajo</span><span class="chip" style="height:24px">Escuela</span><span class="chip" style="height:24px">Personal</span></div>
        <span class="act">Ver proyectos</span></div>
      <div class="card-b">
        ${proys.map(([n,a,s,b,p,nx])=>`<div class="list-item" style="padding:8px 0">
          <div style="width:290px;font-weight:600">${n}</div>${amb(a)}
          <span class="badge ${b}" style="width:92px;justify-content:center">${s}</span>
          <div style="flex:1" class="bar"><i style="width:${p}%"></i></div><b style="width:36px;text-align:right">${p}%</b>
          <span class="muted" style="width:150px;text-align:right;font-size:11.5px">${nx}</span></div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-h">${ic('flame')}Carga de la semana<span class="act">Detalle</span></div>
      <div class="card-b">
        <div style="display:flex;align-items:flex-end;gap:12px;height:120px;padding:6px 4px 0">
          ${week.map(([d,h],k)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end">
            <span style="font-size:10.5px;font-weight:600;color:var(--muted)">${h}h</span>
            <div style="width:100%;height:${h/max*82}%;min-height:3px;border-radius:6px;background:${heat(h)};${k===2?'outline:2px solid var(--text);outline-offset:2px':''}"></div>
            <span style="font-weight:600;font-size:11.5px;${k===2?'color:var(--primary)':''}">${d}</span></div>`).join('')}
        </div>
      </div>
    </div>
  </div>`);
}

/* ---------------- PROYECTOS (KANBAN) ---------------- */
function proyectos(){
  const cols = [
    ['Idea','#94a3b8',[['Orquestación de agentes IA (Hermes)','Personal',15,'Sin fecha',['IA','Automatización'],3,0],['Lector inteligente de facturas PDF','Trabajo',0,'Sin fecha',['Python','IA'],1,0]]],
    ['Planeado','#0ea5e9',[['Publicar portafolio en Azure SWA','Personal',5,'15 dic',['Azure'],2,1]]],
    ['En curso','#16a34a',[['Proyecto final: Sistema de inventario','Escuela',42,'28 nov',['SQL','React'],12,4],['Dashboard de indicadores Power BI','Trabajo',61,'20 nov',['Power BI','DAX'],8,6],['Ensayo: Ética en IA','Escuela',30,'18 nov',['Redacción'],3,1]]],
    ['En revisión','#d97706',[['App Mi Comunidad Los Robles','Trabajo',78,'Hoy 10:00',['Power Apps','SQL'],24,11],['Prototipo UI — Diseño Web','Escuela',90,'13 nov',['Figma'],6,8]]],
    ['Terminado','#64748b',[['Flujo de aprobación de compras','Trabajo',100,'Cerrado 4 nov',['Power Automate'],10,5]]],
  ];
  const card = ([n,a,p,f,tags,notes,imgs]) => `<div class="card" style="padding:13px 14px;margin-bottom:10px">
    <div class="row" style="margin-bottom:8px">${amb(a)}<span style="margin-left:auto;color:var(--subtle)">${ic('ellipsis')}</span></div>
    <div style="font-weight:650;font-size:13.5px;line-height:1.3;margin-bottom:8px">${n}</div>
    ${imgs?`<div class="img ${['g1','g2','g3','g4'][n.length%4]}" style="height:${n.length%2?64:0}px;margin-bottom:${n.length%2?10:0}px;display:${n.length%2?'grid':'none'}">${ic('image')}</div>`:''}
    <div class="row" style="gap:5px;flex-wrap:wrap;margin-bottom:10px">${tags.map(t=>`<span class="badge b-gray">${t}</span>`).join('')}</div>
    <div class="row" style="gap:8px;margin-bottom:10px"><div class="bar" style="flex:1"><i style="width:${p}%;${p===100?'background:var(--ok)':''}"></i></div><b style="font-size:11.5px">${p}%</b></div>
    <div class="row muted" style="font-size:11.5px;gap:12px"><span class="row" style="gap:4px">${ic('clock')}${f}</span><span class="row" style="gap:4px;margin-left:auto">${ic('notebook-pen')}${notes}</span><span class="row" style="gap:4px">${ic('image')}${imgs}</span></div>
  </div>`;
  return shell('proyectos','Proyectos','8 activos · 1 terminado este mes',`
  <div class="toolbar">
    <div class="seg"><a>${ic('table')}Tabla</a><a>${ic('layout-grid')}Tarjetas</a><a class="on">${ic('columns-3')}Kanban</a></div>
    <span style="width:8px"></span>
    <span class="chip on">Todos los ámbitos</span><span class="chip"><span class="sdot" style="background:var(--trabajo)"></span>Trabajo</span><span class="chip"><span class="sdot" style="background:var(--escuela)"></span>Escuela</span><span class="chip"><span class="sdot" style="background:var(--personal)"></span>Personal</span>
    <span class="chip">${ic('tag')}Etiquetas</span>
    <span style="margin-left:auto" class="btn sm">${ic('archive')}Archivados</span><span class="btn sm">${ic('arrow-down-up')}Ordenar: fecha objetivo</span>
  </div>
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:start">
    ${cols.map(([t,c,items])=>`<div style="background:#eaeef4;border-radius:12px;padding:10px">
      <div class="row" style="padding:2px 4px 10px;font-weight:650"><span class="sdot" style="background:${c}"></span>${t}<span class="badge b-gray" style="background:#fff">${items.length}</span><span style="margin-left:auto;color:var(--muted)">${ic('plus')}</span></div>
      ${items.map(card).join('')}

      ${[['08:30','Daily del equipo','teams'],['10:00','Revisión App Mi Comunidad','trabajo'],['16:00','1:1 jefe directo','teams'],['19:00','Clase BD II','escuela']].map(([h,t,c])=>`<div class="row" style="padding:6px 0"><b style="width:44px;font-size:12px">${h}</b><span style="width:3px;height:24px;border-radius:2px;background:var(--${c})"></span><span style="font-weight:550">${t}</span></div>`).join('')}</div></div>
    <div class="card"><div class="card-h">${ic('list-checks')}Pendientes</div><div class="card-b">
      ${['Entregar Actividad 3','Revisar SQL tesorería','Regalo para Ana'].map(t=>`<div class="list-item"><span class="chk"></span>${t}</div>`).join('')}</div></div>
  </div>${tabbar(0)}`);
  const s2 = phone(`${status}<div style="padding:6px 18px 90px;overflow:hidden">
    <div class="row muted" style="font-size:12px">${ic('chevron-left')}Proyectos</div><div style="font-size:19px;font-weight:700;margin:4px 0 8px">App Mi Comunidad Los Robles</div>
    <div class="row" style="gap:6px;margin-bottom:10px">${amb('Trabajo')}<span class="badge b-warn">En revisión</span><b style="margin-left:auto">78%</b></div>
    <div class="bar" style="margin-bottom:12px"><i style="width:78%"></i></div>
    <div class="row" style="gap:6px;margin-bottom:12px;overflow:hidden"><span class="chip on">Bitácora</span><span class="chip">Tareas</span><span class="chip">Notas</span><span class="chip">Imágenes</span></div>
    ${[['Hoy · 08:42','Avance','b-ok','Se corrigió el cálculo del saldo; la consulta bajó a 0.6 s.','g1'],['Ayer · 18:15','Decisión','b-blue','Separar caja chica de tesorería.',null],['Lun 9 · 11:30','Revisión','b-warn','El comité pidió filtro por torre y exportar a Excel.',null]].map(([f,l,b,t,g])=>`<div class="card" style="padding:12px;margin-bottom:10px"><div class="row" style="margin-bottom:4px"><span class="badge ${b}">${l}</span><span class="muted" style="font-size:11px">${f}</span></div>${t}${g?`<div class="img ${g}" style="height:90px;margin-top:8px">${ic('image')}</div>`:''}</div>`).join('')}
    <div style="position:absolute;right:18px;bottom:90px;height:46px;padding:0 16px;border-radius:23px;background:var(--primary);color:#fff;display:flex;align-items:center;gap:8px;font-weight:600;box-shadow:0 8px 20px rgba(37,99,235,.35)">${ic('camera')}Foto + nota</div>
  </div>${tabbar(1)}`);
  return `<div style="width:1440px;height:900px;background:linear-gradient(135deg,#e0e7ff,#f1f5f9);display:flex;align-items:center;justify-content:center;gap:80px">
    <div style="width:360px"><div class="badge b-blue" style="margin-bottom:12px">Versión móvil (PWA)</div><div style="font-size:30px;font-weight:750;line-height:1.15;letter-spacing:-.02em;margin-bottom:12px">Tu día y tus avances, también en el celular</div><div class="muted" style="font-size:14px">Barra inferior con acceso rápido, botón central “+” para capturar tareas, notas o eventos, y registro de bitácora con foto directa desde la cámara.</div></div>
    ${s1}${s2}</div>`;
}

const SCREENS = {hoy,proyectos,detalle,tareas,agenda,carga,notas,cumple,ajustes,teams,movil};
const key = (location.hash||'#hoy').slice(1);
document.getElementById('root').innerHTML = (SCREENS[key]||hoy)();
</script>
</body>
