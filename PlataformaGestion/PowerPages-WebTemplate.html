{% raw %}
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Política de seguridad: la página no puede cargar ni enviar nada a otros servidores -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; connect-src data: blob:; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Nova Organización</title>
<style>
/* ===== Plataforma de Gestión — estilos (minimalista, basada en listas) ===== */
:root{
  --bg:#F4F7FA; --sup:#ffffff; --tx:#0b2a4a; --mut:#5d6f84; --bd:#dde5ee; --ac:#0B84F3; --lat:#073763; --lat-tx:#ffffff; --oro:#E6A817; --z:1;
  --ac-s:color-mix(in srgb,var(--ac) 11%,var(--sup));
  --hover:color-mix(in srgb,var(--tx) 5%,transparent);
  --ok:#1f9d55; --warn:#c77700; --bad:#d23b3b;
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Aptos,"Segoe UI",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ac);text-decoration:none}
a:hover{text-decoration:underline}
#fondo{position:fixed;inset:0;background-size:cover;background-position:center;pointer-events:none;z-index:0}

/* ---------- Estructura ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:216px minmax(0,1fr);height:calc(100vh / var(--z))}
.lat{background:var(--lat);color:var(--lat-tx);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.marca{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.marca svg{width:44px;height:44px;flex:none;border-radius:11px;box-shadow:0 0 0 1.5px color-mix(in srgb,var(--lat-tx) 55%,transparent)}
.marca b{display:block;font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.2}
.marca small{display:block;font-weight:400;color:color-mix(in srgb,var(--lat-tx) 70%,transparent);font-size:11.5px;margin-top:1px}
.lat .regla{height:1px;margin:0 16px 8px;background:linear-gradient(90deg,var(--oro),transparent)}
.lat nav{flex:1;overflow:auto;padding:4px 8px}
.lat nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;color:var(--lat-tx);text-decoration:none;margin-bottom:1px}
.lat nav a:hover{background:color-mix(in srgb,var(--lat-tx) 10%,transparent)}
.lat nav a.on{background:color-mix(in srgb,var(--lat-tx) 16%,transparent);font-weight:600;box-shadow:inset 3px 0 0 var(--oro)}
.lat nav a .n{margin-left:auto;font-size:11.5px;color:color-mix(in srgb,var(--lat-tx) 70%,transparent);font-weight:500}
.lat nav hr{border:0;border-top:1px solid color-mix(in srgb,var(--lat-tx) 18%,transparent);margin:8px 6px}
.lat .pie{padding:10px 18px;border-top:1px solid color-mix(in srgb,var(--lat-tx) 18%,transparent);font-size:12px;color:color-mix(in srgb,var(--lat-tx) 70%,transparent);display:flex;gap:6px;align-items:center}
.lat .pie i{width:7px;height:7px;border-radius:50%;background:#35d07f;display:inline-block}
.lat .pie.pend i{background:var(--oro)}
.pral{overflow:auto;min-width:0}
.cont{max-width:1180px;margin:0 auto;padding:22px 28px 60px}
.banda{height:96px;background-size:cover;background-position:center;border-bottom:1px solid var(--bd)}
.cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.cab h1{font-size:20px;font-weight:700;letter-spacing:-.015em}
.cab .sub{color:var(--mut);font-size:13px}
.esp{flex:1}
.miga{font-size:12.5px;color:var(--mut);margin-bottom:6px}

/* ---------- Controles ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--bd);border-radius:6px;background:var(--sup);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.peligro{color:var(--bad)}
.btn.ch{height:26px;padding:0 9px;font-size:12.5px}
.lnk{background:none;border:0;color:var(--ac);cursor:pointer;padding:0;font-weight:500}
.lnk:hover{text-decoration:underline}
.lnk.gris{color:var(--mut)}
input[type=text],input[type=search],input[type=date],input[type=time],input[type=number],input[type=password],input[type=url],select,textarea{
  height:32px;padding:0 9px;border:1px solid var(--bd);border-radius:6px;background:var(--sup);outline:none;min-width:0}
textarea{height:auto;padding:8px 9px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent)}
input[type=color]{width:34px;height:30px;padding:2px;border:1px solid var(--bd);border-radius:6px;background:var(--sup);cursor:pointer}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--ac);cursor:pointer;flex:none}
.barra{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--mut);font-weight:500;white-space:nowrap;margin-bottom:-1px}
.tabs button.on{color:var(--ac);border-color:var(--ac)}
.fil{display:inline-flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden;background:var(--sup)}
.fil button{background:none;border:0;border-right:1px solid var(--bd);height:30px;padding:0 11px;cursor:pointer;color:var(--mut);font-size:13px;white-space:nowrap}
.fil button:last-child{border-right:0}
.fil button.on{background:var(--ac-s);color:var(--ac);font-weight:600}

/* ---------- Listas ---------- */
.panel{background:var(--sup);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.scrollx{overflow-x:auto}
table.lista{width:100%;border-collapse:collapse}
.lista th{text-align:left;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:9px 12px;border-bottom:1px solid var(--bd);white-space:nowrap;background:color-mix(in srgb,var(--bg) 60%,var(--sup))}
.lista td{padding:8px 12px;border-bottom:1px solid var(--bd);vertical-align:middle}
.lista tr:last-child td{border-bottom:0}
.lista tbody tr:hover{background:var(--hover)}
.lista .t{font-weight:500;cursor:pointer}
.lista .t:hover{color:var(--ac)}
.lista .d{color:var(--mut);font-size:12.5px}
.lista td.num,.lista th.num{text-align:right;white-space:nowrap}
.lista td.nw{white-space:nowrap}
.lista tr.hecho .t{text-decoration:line-through;color:var(--mut)}
.lista tr.grupo td{background:color-mix(in srgb,var(--bg) 60%,var(--sup));font-weight:600;font-size:12.5px;padding:6px 12px}
.lista select{height:26px;font-size:12.5px;padding:0 4px;border-color:transparent;background:transparent;max-width:150px}
.lista select:hover{border-color:var(--bd)}
.lista input[type=number]{height:26px;width:64px;text-align:right}
.vacio{padding:34px 16px;text-align:center;color:var(--mut)}
.vacio b{display:block;color:var(--tx);margin-bottom:4px;font-weight:600}
.pt{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:baseline;flex:none}
.et{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:10px;background:var(--hover);color:var(--mut);white-space:nowrap}
.et.ac{background:var(--ac-s);color:var(--ac)}
.rojo{color:var(--bad)} .ambar{color:var(--warn)} .verde{color:var(--ok)} .mut{color:var(--mut)}
.av{display:flex;align-items:center;gap:8px;min-width:110px}
.av div{flex:1;height:4px;border-radius:2px;background:var(--bd);overflow:hidden}
.av div i{display:block;height:100%;background:var(--ac)}
.av span{font-size:12px;color:var(--mut);width:32px;text-align:right}

/* ---------- Bloques (Inicio) ---------- */
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.blq{background:var(--sup);border:1px solid var(--bd);border-radius:var(--r)}
.blq h3{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:11px 14px;border-bottom:1px solid var(--bd)}
.blq h3 .lnk{margin-left:12px;text-transform:none;letter-spacing:0;font-size:12.5px}
.blq h3 .lnk:first-of-type{margin-left:auto}
.blq h3 .ct{font-weight:500;text-transform:none;letter-spacing:0}
.tab6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;align-items:start}
.blq .rap{padding:8px 10px;border-top:1px solid var(--bd)}
.blq .rap input{width:100%}
.filas{list-style:none}
.filas li{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--bd);min-width:0}
.filas li:last-child{border-bottom:0}
.filas .h{width:46px;color:var(--mut);font-size:12.5px;flex:none;font-variant-numeric:tabular-nums}
.filas .x{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filas .x.clic{cursor:pointer}
.filas .x.clic:hover{color:var(--ac)}
.filas .x{flex:1 1 50%}
.filas .m{color:var(--mut);font-size:12.5px;white-space:nowrap;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.filas .m:last-child{flex:none}
.frase{position:relative;border-radius:var(--r);border:1px solid var(--bd);background:var(--sup) center/cover;min-height:150px;display:flex;align-items:flex-end;margin-bottom:16px;overflow:hidden}
.frase.img::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.62))}
.frase .tx{position:relative;padding:18px 20px;max-width:760px}
.frase p{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.frase span{font-size:13px;color:var(--mut)}
.frase.img p,.frase.img span{color:#fff}
.frase .ctl{position:absolute;top:10px;right:12px;display:flex;gap:10px;font-size:12.5px}
.frase.img .ctl .lnk{color:#fff}

/* ---------- Agenda ---------- */
.ag{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--sup);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.mes .dn{padding:7px 8px;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);border-bottom:1px solid var(--bd)}
.mes .c{min-height:86px;padding:5px 6px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);cursor:pointer;overflow:hidden}
.mes .c:nth-child(7n){border-right:0}
.mes .c:hover{background:var(--hover)}
.mes .c.fuera{opacity:.4}
.mes .c.sel{box-shadow:inset 0 0 0 2px var(--ac)}
.mes .c .nd{font-size:12.5px;font-weight:600;display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:11px}
.mes .c.hoy .nd{background:var(--ac);color:#fff}
.mes .c .it{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.mes .c .mas{font-size:11px;color:var(--mut)}

/* ---------- Línea de tiempo ---------- */
.tl{position:relative;overflow:auto;background:var(--sup);border:1px solid var(--bd);border-radius:var(--r);max-height:68vh}
.tl .in{position:relative}
.tl .fila{display:flex;border-bottom:1px solid var(--bd);position:relative}
.tl .rot{position:sticky;left:0;z-index:3;width:170px;flex:none;background:var(--sup);border-right:1px solid var(--bd);padding:6px 10px;font-size:12.5px;font-weight:500;display:flex;align-items:center;overflow:hidden}
.tl .rot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl .pista{position:relative;flex:none;background-image:linear-gradient(to right,var(--bd) 1px,transparent 1px)}
.tl .cabz{position:sticky;top:0;z-index:4;background:var(--sup)}
.tl .cabz .rot{z-index:5}
.tl .mescel{position:absolute;top:0;height:22px;font-size:11.5px;font-weight:600;color:var(--mut);padding:3px 6px;border-left:1px solid var(--bd);text-transform:uppercase;letter-spacing:.05em}
.tl .dcel{position:absolute;top:22px;height:30px;text-align:center;font-size:11px;line-height:1.25;color:var(--mut);padding-top:2px}
.tl .dcel b{display:block;color:var(--tx);font-weight:600}
.tl .dcel.fs{background:var(--hover)}
.tl .dcel.hoy b{color:var(--ac)}
.tl .ccel{position:absolute;top:3px;height:20px;text-align:center;font-size:11px;font-weight:600;line-height:20px;border-radius:4px}
.tl .bar{position:absolute;height:20px;border-radius:4px;color:#fff;font-size:11px;line-height:20px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tl .bar.proceso{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 5px,transparent 5px 10px)}
.tl .bar.guardada{opacity:.72}
.tl .bar.enviada,.tl .bar.calificada{opacity:.38}
.tl .bar.vac{background:repeating-linear-gradient(135deg,var(--bd) 0 5px,transparent 5px 10px)!important;color:var(--mut);border:1px dashed var(--mut)}
.tl .hoyl{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:2;pointer-events:none}
.ley{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.ley i{display:inline-block;width:22px;height:10px;border-radius:3px;background:var(--mut);vertical-align:middle;margin-right:5px}

/* ---------- Evaluación ---------- */
.eval{padding:14px 16px;border-bottom:1px solid var(--bd)}
.eval .ln{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.eval .nm{font-weight:600;font-size:15px}
.eval .kp{display:flex;gap:22px;flex-wrap:wrap;margin:10px 0 8px}
.eval .kp div{font-size:12px;color:var(--mut)}
.eval .kp b{display:block;font-size:18px;color:var(--tx);font-weight:700;letter-spacing:-.01em}
.pila{position:relative;height:10px;border-radius:5px;background:var(--bd);display:flex;overflow:visible}
.pila i{display:block;height:100%}
.pila i:first-child{border-radius:5px 0 0 5px}
.pila .meta{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--tx)}
.pila .meta::after{content:attr(data-t);position:absolute;top:-17px;left:-14px;font-size:10.5px;color:var(--mut);white-space:nowrap}

/* ---------- Notas ---------- */
.nt{display:grid;grid-template-columns:290px minmax(0,1fr);gap:0;background:var(--sup);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;height:calc(100vh - 190px);min-height:420px}
.nt .izq{border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.nt .izq .bq{padding:10px;border-bottom:1px solid var(--bd)}
.nt .izq .bq input{width:100%}
.nt .ls{overflow:auto;flex:1}
.nt .it{padding:9px 12px;border-bottom:1px solid var(--bd);cursor:pointer}
.nt .it:hover{background:var(--hover)}
.nt .it.on{background:var(--ac-s)}
.nt .it b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt .it span{display:block;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt .der{display:flex;flex-direction:column;min-height:0;min-width:0}
.nt .der .hd select{max-width:190px}
.nt .der .hd{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.nt .der input.tit{border:0;font-size:17px;font-weight:600;padding:12px 16px 4px;height:auto;width:100%;background:transparent;box-shadow:none}
.nt .der textarea{flex:1;border:0;border-radius:0;padding:8px 16px 16px;resize:none;background:transparent;box-shadow:none;font-size:14.5px}

/* ---------- Bitácora ---------- */
.bit{list-style:none}
.bit li{padding:12px 14px;border-bottom:1px solid var(--bd)}
.bit li:last-child{border-bottom:0}
.bit .mt{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--mut);margin-bottom:4px}
.bit .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.minis{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.minis img{height:84px;border-radius:6px;border:1px solid var(--bd);cursor:zoom-in;display:block}
.comp{padding:12px 14px;border-bottom:1px solid var(--bd);display:grid;gap:8px}
.comp textarea{width:100%}

/* ---------- Ajustes ---------- */
.aj{display:grid;gap:16px;max-width:860px}
.aj .blq .cu{padding:14px}
.reng{display:flex;align-items:center;gap:10px;padding:8px 0;flex-wrap:wrap}
.reng>label{width:210px;color:var(--mut);font-size:13px}
.pres{display:flex;gap:8px;flex-wrap:wrap}
.pres button{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;border:1px solid var(--bd);border-radius:6px;background:var(--sup);cursor:pointer}
.pres button.on{border-color:var(--ac);box-shadow:0 0 0 2px color-mix(in srgb,var(--ac) 22%,transparent)}
.pres i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(128,128,128,.4)}
.prev{height:70px;width:120px;border-radius:6px;border:1px solid var(--bd);background:var(--bg) center/cover}

/* ---------- Modal / avisos ---------- */
.velo{position:fixed;inset:0;background:rgba(10,15,25,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.velo.on{display:flex}
.caja{background:var(--sup);border:1px solid var(--bd);border-radius:10px;width:100%;max-width:560px;max-height:calc(100vh / var(--z) - 32px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25);overflow:hidden}
.form{display:flex;flex-direction:column;min-height:0;flex:1}
.form h2{font-size:16px;padding:14px 18px 10px;border-bottom:1px solid var(--bd);flex:none}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:14px 18px;overflow:auto;flex:1;min-height:0;align-content:start}
.campo{grid-column:span 2;display:grid;gap:4px}
.campo.medio{grid-column:span 1}
.campo label{font-size:12.5px;font-weight:600;color:var(--mut)}
.campo input:not([type=checkbox]):not([type=color]),.campo select,.campo textarea{width:100%}
.campo small{color:var(--mut);font-size:12px}
.campo .chk{display:flex;align-items:center;gap:8px;font-weight:400;color:var(--tx);font-size:14px}
.acciones{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--bd);flex:none;flex-wrap:wrap;background:var(--sup)}
.cuerpo{padding:14px 18px}
#visor{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:70;cursor:zoom-out}
#visor.on{display:flex}
#visor img{max-width:94vw;max-height:92vh;border-radius:6px}
#avisos{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:80}
.aviso{background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:7px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:360px}
.aviso.err{background:var(--bad);color:#fff}

/* ---------- Móvil ---------- */
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .lat{min-width:0}
  #avisos{left:14px;right:14px}
  .lat{border-right:0;border-bottom:1px solid var(--bd)}
  .marca small,.lat .pie{display:none}
  .lat nav{display:flex;overflow-x:auto;padding:4px 8px 8px}
  .lat nav a{white-space:nowrap;margin:0 2px 0 0}
  .lat nav hr{display:none}
  .cont{padding:16px 14px 50px}
  .cols,.ag{grid-template-columns:1fr}
  .tab6>*{grid-column:1/-1!important}
  .marca{padding:10px 14px 6px}
  .lat .regla{display:none}
  .nt{grid-template-columns:1fr;height:auto}
  .nt .izq{border-right:0;border-bottom:1px solid var(--bd);max-height:240px}
  .nt .der textarea{min-height:300px}
  .campos{grid-template-columns:1fr}
  .campo.medio{grid-column:span 2}
  .mes .c{min-height:58px}
  .mes .c .it{display:none}
}

</style>
</head>
<body>
<div id="fondo"></div>
<div class="app">
  <aside class="lat" id="lat"></aside>
  <main class="pral" id="pral"></main>
</div>
<div class="velo" id="modal" onmousedown="if(event.target===this)Modal.cerrar()"><div class="caja"></div></div>
<div class="velo" id="confirma" style="z-index:60"><div class="caja" style="max-width:440px"></div></div>
<div id="visor" onclick="this.classList.remove('on')"><img alt="Imagen ampliada"></div>

/* ===== 01-nucleo.js ===== */
'use strict';

/* ---------- Utilidades generales ---------- */
const $ = (sel, raiz = document) => raiz.querySelector(sel);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12));
const p2 = n => String(n).padStart(2, '0');

/* ---------- Fechas (se guardan como AAAA-MM-DD) ---------- */
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const MESES_C = MESES.map(m => m.slice(0, 3));
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const aISO = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
const deISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const hoyISO = () => aISO(new Date());
const sumaDias = (iso, n) => { const d = deISO(iso); d.setDate(d.getDate() + n); return aISO(d); };
const difDias = (a, b) => Math.round((deISO(b) - deISO(a)) / 864e5);
const fFecha = iso => { if (!iso) return ''; const d = deISO(iso); return `${d.getDate()} ${MESES_C[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''}`; };
const may = s => s.charAt(0).toUpperCase() + s.slice(1);
const fFechaLarga = iso => { const d = deISO(iso); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const aDMY = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };
function fRel(iso) {
  if (!iso) return '';
  const n = difDias(hoyISO(), iso);
  if (n === 0) return 'Hoy'; if (n === 1) return 'Mañana'; if (n === -1) return 'Ayer';
  if (n > 1 && n <= 14) return `En ${n} días`;
  if (n < -1 && n >= -30) return `Hace ${-n} días`;
  return fFecha(iso);
}
/** Convierte dd/mm/aaaa, d-m-aaaa o aaaa-mm-dd a ISO. Devuelve '' si no es válida. */
function parseFecha(txt) {
  const t = String(txt || '').trim(); if (!t) return '';
  let y, m, d, r;
  if ((r = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) [, y, m, d] = r;
  else if ((r = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))) { [, d, m, y] = r; if (y.length === 2) y = '20' + y; }
  else return '';
  y = +y; m = +m; d = +d;
  const f = new Date(y, m - 1, d);
  return (f.getFullYear() === y && f.getMonth() === m - 1 && f.getDate() === d) ? aISO(f) : '';
}

/* ---------- Almacenamiento (IndexedDB; respaldo en localStorage) ----------
   Toda la app pasa por este objeto. Para conectar después Dataverse (Power Pages)
   u otra API, basta con sustituir estos métodos.                              */
const DB = {
  _db: null, idb: true,
  abrir() {
    return new Promise(ok => {
      try {
        const r = indexedDB.open('plataforma_gestion', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('img'); };
        r.onsuccess = () => { this._db = r.result; ok(); };
        r.onerror = () => { this.idb = false; ok(); };
      } catch (e) { this.idb = false; ok(); }
    });
  },
  _op(almacen, modo, fn) {
    return new Promise((ok, err) => {
      const t = this._db.transaction(almacen, modo); const rq = fn(t.objectStore(almacen));
      t.oncomplete = () => ok(rq ? rq.result : undefined); t.onerror = () => err(t.error); t.onabort = () => err(t.error);
    });
  },
  async leerEstado() {
    if (this.idb) return this._op('kv', 'readonly', s => s.get('estado'));
    try { return JSON.parse(localStorage.getItem('pg_estado') || 'null'); } catch (e) { return null; }
  },
  async escribirEstado(v) {
    if (this.idb) return this._op('kv', 'readwrite', s => s.put(v, 'estado'));
    localStorage.setItem('pg_estado', JSON.stringify(v));
  },
  async imgTodas() {
    if (!this.idb) return [];
    const claves = await this._op('img', 'readonly', s => s.getAllKeys());
    const vals = await this._op('img', 'readonly', s => s.getAll());
    return claves.map((id, i) => ({ id, blob: vals[i] }));
  },
  async imgPoner(id, blob) { if (this.idb) return this._op('img', 'readwrite', s => s.put(blob, id)); },
  async imgQuitar(id) { if (this.idb) return this._op('img', 'readwrite', s => s.delete(id)); },
  async imgVaciar() { if (this.idb) return this._op('img', 'readwrite', s => s.clear()); }
};

/* ---------- Imágenes (se comprimen y se guardan aparte del estado) ---------- */
const Img = {
  blobs: new Map(), urls: new Map(),
  async cargar() { for (const { id, blob } of await DB.imgTodas()) this._reg(id, blob); },
  _reg(id, blob) { this.blobs.set(id, blob); this.urls.set(id, URL.createObjectURL(blob)); },
  url(id) { return id ? (this.urls.get(id) || '') : ''; },
  /** Reduce la imagen a un lado máximo y la guarda. Devuelve su id. */
  async agregar(archivo, maxLado = 1600) {
    if (!archivo || !archivo.type.startsWith('image/')) throw new Error('El archivo no es una imagen');
    if (!DB.idb) throw new Error('Este navegador no permite guardar imágenes (modo privado)');
    if (archivo.size > 25 * 1048576) throw new Error('La imagen supera 25 MB');
    let blob = archivo;
    try {
      const bmp = await createImageBitmap(archivo);
      const k = Math.min(1, maxLado / Math.max(bmp.width, bmp.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
      cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
      const b = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85));
      if (b && (k < 1 || b.size < archivo.size)) blob = b;
    } catch (e) { /* si no se puede procesar (p. ej. SVG) se guarda tal cual */ }
    const id = uid(); await DB.imgPoner(id, blob); this._reg(id, blob); return id;
  },
  async quitar(id) {
    if (!id || !this.blobs.has(id)) return;
    URL.revokeObjectURL(this.urls.get(id)); this.urls.delete(id); this.blobs.delete(id); await DB.imgQuitar(id);
  },
  aDataURL(blob) { return new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(blob); }); },
  async deDataURL(id, dataUrl) {
    // Sólo se aceptan imágenes incrustadas: un respaldo no puede hacer que la app descargue algo de internet
    if (!/^data:image\/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=\s]+$/i.test(String(dataUrl)) || !/^[A-Za-z0-9_-]{1,64}$/.test(String(id))) throw new Error('Imagen no válida');
    const blob = await (await fetch(dataUrl)).blob(); await DB.imgPoner(id, blob); this._reg(id, blob); }
};

];

<rect width="64" height="64" rx="14" fill="#073763"/><path d="M32 32C26.5 22.5 11 22.5 11 32s15.5 9.5 21 0c5.500-9.500 21-9.500 21 0s-15.500 9.500-21 0z" fill="none" stroke="url(#lgN)" stroke-width="5.200" stroke-linecap="round"/>
<rect x="38.600" y="32" width="2.600" height="4.500" rx=".6" fill="#0B84F3"/><rect x="42.300" y="29.500" width="2.600" height="7" rx=".6" fill="#0B84F3"/><rect x="46" y="27" width="2.600" height="9.500" rx=".6" fill="#0B84F3"/></svg>`;

function estadoVacio() {

    v: 1,
    ajustes: { nombre: 'Nova Organización', lema: 'Evolución sin límites.', usuario: '', temaId: 'nova', tema: temaDe('nova'), escala: 100, fondoImg: null, fondoOp: 14, bandaImg: null, metaEscolar: 60, avisoCumple: 7,

    ],

    ],

let S = estadoVacio();

let _tGuardar = null;
/** Guarda el estado (con una pequeña espera para agrupar cambios seguidos). */
function guardar() {
  const pie = $('.lat .pie'); if (pie) { pie.classList.add('pend'); pie.lastChild.textContent = 'Guardando…'; }
  clearTimeout(_tGuardar);
  _tGuardar = setTimeout(async () => {
    try { await DB.escribirEstado(S); const p = $('.lat .pie'); if (p) { p.classList.remove('pend'); p.lastChild.textContent = 'Guardado en este equipo'; } }
    catch (e) { console.error(e); toast('No se pudo guardar: ' + e.message, 'err'); }
  }, 250);
}
const por = (lista, id) => S[lista].find(x => x.id === id);
function poner(lista, obj) { const i = S[lista].findIndex(x => x.id === obj.id); if (i >= 0) S[lista][i] = obj; else S[lista].push(obj); guardar(); }
function quitar(lista, id) { S[lista] = S[lista].filter(x => x.id !== id); guardar(); }
const estFinal = id => !!(por('estatus', id) || {}).final;
const idFinal = () => (S.estatus.find(e => e.final) || S.estatus[S.estatus.length - 1]).id;
const idInicial = () => S.estatus[0].id;
/** Bitácora automática de cambios de estatus (proyectos, actividades y actividades escolares). */
function regEstatus(lista, o, antes, despues) {
  if (antes === despues || !despues) return;
  const nom = v => !v ? '' : lista === 'escolares' ? (EST_ESC.find(x => x[0] === v) || ['', v])[1] : (por('estatus', v) || { nombre: v }).nombre;
  S.historial.push({ id: uid(), lista, ref: o.id, titulo: o.nombre || o.titulo || '', proyecto: lista === 'proyectos' ? o.id : (o.proyecto || ''), de: nom(antes), a: nom(despues), fecha: ahoraTxt() });
  if (S.historial.length > 5000) S.historial.splice(0, S.historial.length - 5000);
}

/* ---------- Tema ---------- */
function aplicarTema() {
  const t = S.ajustes.tema, r = document.documentElement.style;
  for (const [k] of COLORES_TEMA) r.setProperty('--' + k, t[k]);
  r.setProperty('color-scheme', esOscuro(t.sup) ? 'dark' : 'light');   // para que los controles nativos combinen
  r.setProperty('--lat-tx', esOscuro(t.lat) ? '#ffffff' : t.tx);
  const z = (S.ajustes.escala || 100) / 100; r.setProperty('--z', z); document.body.style.zoom = z;
  const f = $('#fondo'), u = Img.url(S.ajustes.fondoImg);
  f.style.backgroundImage = u ? `url("${u}")` : 'none'; f.style.opacity = (S.ajustes.fondoOp || 14) / 100;
  document.title = S.ajustes.nombre;
}

/* ---------- Avisos, confirmación, modal ---------- */
function toast(msg, tipo = '') {
  const d = document.createElement('div'); d.className = 'aviso ' + tipo; d.textContent = msg;
  const av = $('#avisos'); while (av.children.length >= 3) av.firstChild.remove(); av.appendChild(d); setTimeout(() => d.remove(), tipo === 'err' ? 5000 : 2600);
}
const Modal = {
  abrir(html, ancho) { const c = $('#modal .caja'); c.style.maxWidth = (ancho || 620) + 'px'; c.innerHTML = html; $('#modal').classList.add('on'); },
  cerrar() { $('#modal').classList.remove('on'); $('#modal .caja').innerHTML = ''; }
};
let _siConfirma = null;
function confirmar(msg, alAceptar, textoBoton = 'Eliminar') {
  _siConfirma = alAceptar;
  $('#confirma .caja').innerHTML = `<div class="cuerpo">${esc(msg)}</div><div class="acciones"><span class="esp"></span>
    <button class="btn" onclick="cerrarConfirma()">Cancelar</button><button class="btn peligro" onclick="cerrarConfirma(true)">${esc(textoBoton)}</button></div>`;
  $('#confirma').classList.add('on');
}
function cerrarConfirma(acepta) { $('#confirma').classList.remove('on'); const f = _siConfirma; _siConfirma = null; if (acepta && f) f(); }
function verImagen(url) { $('#visor img').src = url; $('#visor').classList.add('on'); }

/* ---------- Formulario genérico ----------
   campos: [{k, label, tipo, opciones, req, medio, ayuda, def, min, max, paso, filas}]
   tipo: text | textarea | date | time | number | select | color | check | url | password | imagen */
const Form = {
  _c: null,
  abrir({ titulo, campos, valores = {}, guardar, eliminar, ancho, nota = '' }) {
    this._c = { campos, guardar, eliminar };
    Modal.abrir(`<form class="form" onsubmit="Form.enviar(event)" novalidate>
      <h2>${esc(titulo)}</h2><div class="campos">${campos.map(c => this._campo(c, valores[c.k] ?? c.def ?? '')).join('')}${nota}</div>
      <div class="acciones">${eliminar ? '<button type="button" class="btn peligro" onclick="Form.borrar()">Eliminar</button>' : ''}<span class="esp"></span>
      <button type="button" class="btn" onclick="Modal.cerrar()">Cancelar</button><button class="btn pri">Guardar</button></div></form>`, ancho);
    const primero = $('#modal input:not([type=checkbox]):not([type=file]), #modal textarea'); if (primero) primero.focus();
  },
  _campo(c, v) {
    const id = 'f_' + c.k; let ctl;
    const at = `${c.req ? 'required' : ''} ${c.min != null ? `min="${c.min}"` : ''} ${c.max != null ? `max="${c.max}"` : ''} ${c.paso ? `step="${c.paso}"` : ''} ${c.ph ? `placeholder="${esc(c.ph)}"` : ''}`;
    if (c.tipo === 'textarea') ctl = `<textarea id="${id}" rows="${c.filas || 4}" ${at}>${esc(v)}</textarea>`;
    else if (c.tipo === 'select') ctl = `<select id="${id}">${c.opciones.map(o => { const [val, txt] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(txt)}</option>`; }).join('')}</select>`;
    else if (c.tipo === 'check') ctl = `<label class="chk"><input type="checkbox" id="${id}" ${v ? 'checked' : ''}> ${esc(c.texto || '')}</label>`;
    else if (c.tipo === 'imagen') ctl = `${c.actual ? `<img src="${c.actual}" style="height:70px;border-radius:6px;justify-self:start">` : ''}<input type="file" id="${id}" accept="image/*">`;
    else ctl = `<input type="${c.tipo || 'text'}" id="${id}" value="${esc(v)}" ${at}>`;
    return `<div class="campo ${c.medio ? 'medio' : ''}"><label for="${id}">${esc(c.label)}${c.req ? ' *' : ''}</label>${ctl}${c.ayuda ? `<small>${esc(c.ayuda)}</small>` : ''}</div>`;
  },
  async enviar(e) {
    e.preventDefault();
    const v = {};
    for (const c of this._c.campos) {
      const el = $('#f_' + c.k);
      v[c.k] = c.tipo === 'check' ? el.checked : c.tipo === 'imagen' ? (el.files[0] || null) : c.tipo === 'number' ? (el.value === '' ? null : Number(el.value)) : el.value.trim();
      if (c.req && (v[c.k] === '' || v[c.k] == null)) { toast(`Falta: ${c.label}`, 'err'); el.focus(); return; }
    }
    try { const error = await this._c.guardar(v); if (error) { toast(error, 'err'); return; } }
    catch (err) { console.error(err); toast(err.message || 'Ocurrió un error', 'err'); return; }
    Modal.cerrar(); App.pintar();
  },
  borrar() { confirmar('¿Eliminar este registro? Esta acción no se puede deshacer.', async () => { await this._c.eliminar(); Modal.cerrar(); App.pintar(); }); }
};

/* ---------- CSV ---------- */
/** Las celdas que empiezan con = + - @ se anteponen con ' para que Excel no las ejecute como fórmula. */
function csvCelda(v) { let s = String(v ?? ''); if (typeof v === 'string' && /^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function csvTexto(encabezados, filas) { return '﻿' + [encabezados, ...filas].map(f => f.map(csvCelda).join(',')).join('\r\n') + '\r\n'; }
/** Lee CSV con comillas y saltos de línea dentro de celdas. Detecta coma o punto y coma. */
function parseCSV(texto) {
  let t = String(texto || ''); if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
  const pl = t.split(/\r?\n/)[0] || ''; const sep = (pl.split(';').length > pl.split(',').length) ? ';' : ',';
  const filas = []; let fila = [], celda = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { celda += '"'; i++; } else q = false; } else celda += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { fila.push(celda); celda = ''; }
    else if (ch === '\n') { fila.push(celda); filas.push(fila); fila = []; celda = ''; }
    else if (ch !== '\r') celda += ch;
  }
  if (celda !== '' || fila.length) { fila.push(celda); filas.push(fila); }
  return filas.filter(f => f.some(c => c.trim() !== '')).map(f => f.map(c => c.trim().replace(/^'(?=[=+\-@])/, '')));
}

  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);

/* ---------- ZIP sin compresión (para "Exportar todo") ---------- */
const _crcT = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = _crcT[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
/** archivos: [{nombre, texto}] → Blob .zip */
function crearZip(archivos) {
  const enc = new TextEncoder(), partes = [], central = []; let pos = 0;
  const ahora = new Date(), hora = (ahora.getHours() << 11) | (ahora.getMinutes() << 5) | (ahora.getSeconds() >> 1), fecha = ((ahora.getFullYear() - 1980) << 9) | ((ahora.getMonth() + 1) << 5) | ahora.getDate();
  for (const a of archivos) {
    const nom = enc.encode(a.nombre), dat = enc.encode(a.texto), crc = crc32(dat);
    const cab = new DataView(new ArrayBuffer(30));
    cab.setUint32(0, 0x04034b50, true); cab.setUint16(4, 20, true); cab.setUint16(6, 0x0800, true); cab.setUint16(8, 0, true);
    cab.setUint16(10, hora, true); cab.setUint16(12, fecha, true); cab.setUint32(14, crc, true); cab.setUint32(18, dat.length, true); cab.setUint32(22, dat.length, true); cab.setUint16(26, nom.length, true);
    const cen = new DataView(new ArrayBuffer(46));
    cen.setUint32(0, 0x02014b50, true); cen.setUint16(4, 20, true); cen.setUint16(6, 20, true); cen.setUint16(8, 0x0800, true); cen.setUint16(12, hora, true); cen.setUint16(14, fecha, true);
    cen.setUint32(16, crc, true); cen.setUint32(20, dat.length, true); cen.setUint32(24, dat.length, true); cen.setUint16(28, nom.length, true); cen.setUint32(42, pos, true);
    partes.push(cab.buffer, nom, dat); central.push(cen.buffer, nom); pos += 30 + nom.length + dat.length;
  }
  const tamCentral = central.reduce((s, b) => s + (b.byteLength), 0);
  const fin = new DataView(new ArrayBuffer(22));
  fin.setUint32(0, 0x06054b50, true); fin.setUint16(8, archivos.length, true); fin.setUint16(10, archivos.length, true); fin.setUint32(12, tamCentral, true); fin.setUint32(16, pos, true);
  return new Blob([...partes, ...central, fin.buffer], { type: 'application/zip' });
}

/* ---------- Bóveda: notas privadas cifradas con contraseña ----------
   Clave derivada con PBKDF2 (SHA-256, 600 000 iteraciones) y cifrado AES-GCM.
   La contraseña nunca se guarda; sin ella las notas no se pueden recuperar.   */
const b64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
const deB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const Boveda = {
  clave: null, notas: [], _tBloqueo: null,
  disponible: () => !!(window.crypto && crypto.subtle),
  abierta() { return !!this.clave; },
  ITER: 600000,   // recomendación OWASP para PBKDF2-SHA256; las bóvedas anteriores conservan sus 250 000
  async _derivar(pass, sal, iter) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: sal, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async _cifrar(obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, this.clave, new TextEncoder().encode(JSON.stringify(obj)));
    return { iv: b64(iv), ct: b64(ct) };
  },
  async _descifrar(r) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: deB64(r.iv) }, this.clave, deB64(r.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  },
  async crear(pass) {
    const sal = crypto.getRandomValues(new Uint8Array(16));
    this.clave = await this._derivar(pass, sal, this.ITER);
    S.boveda = { sal: b64(sal), iter: this.ITER, prueba: await this._cifrar({ ok: true }) }; S.notasPriv = []; this.notas = []; guardar(); this._temporizador();
  },
  async abrir(pass) {
    const clave = await this._derivar(pass, deB64(S.boveda.sal), S.boveda.iter || 250000);
    const previa = this.clave; this.clave = clave;
    try { await this._descifrar(S.boveda.prueba); } catch (e) { this.clave = previa; return false; }
    this.notas = [];
    for (const r of S.notasPriv) { try { this.notas.push({ id: r.id, ...(await this._descifrar(r)) }); } catch (e) { console.warn('Nota privada ilegible', r.id); } }
    this._temporizador(); return true;
  },
  cerrar() { this.clave = null; this.notas = []; clearTimeout(this._tBloqueo); },
  /** Bloqueo automático tras 5 minutos sin actividad. */
  _temporizador() { clearTimeout(this._tBloqueo); this._tBloqueo = setTimeout(() => { if (this.abierta()) { this.cerrar(); toast('Notas privadas bloqueadas por inactividad'); if (App.vista === 'notas') App.pintar(); } }, 5 * 60 * 1000); },
  async guardarNota(n) {
    const { id, ...datos } = n; const c = await this._cifrar(datos);
    const i = S.notasPriv.findIndex(x => x.id === id); if (i >= 0) S.notasPriv[i] = { id, ...c }; else S.notasPriv.push({ id, ...c });
    const j = this.notas.findIndex(x => x.id === id); if (j >= 0) this.notas[j] = n; else this.notas.push(n);
    guardar(); this._temporizador();
  },
  quitarNota(id) { S.notasPriv = S.notasPriv.filter(x => x.id !== id); this.notas = this.notas.filter(x => x.id !== id); guardar(); },
  async cambiarClave(nueva) {
    const notas = this.notas.slice(); const sal = crypto.getRandomValues(new Uint8Array(16));
    this.clave = await this._derivar(nueva, sal, this.ITER);
    S.boveda = { sal: b64(sal), iter: this.ITER, prueba: await this._cifrar({ ok: true }) }; S.notasPriv = [];
    for (const n of notas) { const { id, ...d } = n; S.notasPriv.push({ id, ...(await this._cifrar(d)) }); }
    guardar();
  }
};

/* ---------- Seguridad de enlaces: sólo http(s) y mailto ---------- */
function urlSegura(u) {
  let t = String(u || '').trim(); if (!t) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(t)) t = 'https://' + t;
  try { const x = new URL(t); return ['http:', 'https:', 'mailto:'].includes(x.protocol) ? x.href : ''; } catch (e) { return ''; }
}
