const Hist = {
  tabla(l) {
    return l.length ? `<table class="lista"><thead><tr><th>Fecha y hora</th><th>Registro</th><th>Tipo</th><th>Cambio</th></tr></thead><tbody>${l.map(h => `<tr><td class="d nw">${esc(h.fecha)}</td><td>${esc(h.titulo)}</td>
      <td class="d nw">${{ proyectos: 'Proyecto', actividades: 'Actividad', escolares: 'Escolar' }[h.lista] || ''}</td><td class="nw"><span class="mut">${esc(h.de || 'Nuevo')}</span> → <b>${esc(h.a)}</b></td></tr>`).join('')}</tbody></table>`
      : vacio('Sin cambios registrados', 'Aquí aparecerá cada cambio de estatus con su fecha y hora.');
  },
  ver(lista) {
    const l = S.historial.filter(h => !lista || h.lista === lista).reverse().slice(0, 400);
    Modal.abrir(`<div class="form"><h2>Historial de cambios de estatus</h2><div class="campos" style="display:block;padding:0">${this.tabla(l)}</div>
      <div class="acciones"><span class="d">${l.length} cambio(s)</span><span class="esp"></span><button class="btn" onclick="Datos.exportarUna('historial_estatus.csv')">Descargar CSV</button><button class="btn pri" onclick="Modal.cerrar()">Cerrar</button></div></div>`, 760);
  },
  /** Resumen para mostrar dentro del formulario de un registro. */
  de(ref) {
    const l = S.historial.filter(h => h.ref === ref).reverse();
    return l.length ? `<div class="campo"><label>Historial de estatus</label><div class="d">${l.slice(0, 12).map(h => `${esc(h.fecha)} · ${esc(h.de || 'Nuevo')} → <b>${esc(h.a)}</b>`).join('<br>')}</div></div>` : '';
  }
};
const btnCarga = tipo => `<button class="btn" onclick="Carga.abrir('${tipo}')">Carga masiva</button>`;
const btnHist = lista => `<button class="btn" onclick="Hist.ver('${lista}')">Historial</button>`;
const campoBuscar = (obj, id, ph) => `<input type="search" id="${id}" placeholder="${ph}" value="${esc(UI[obj].q)}" oninput="buscar('${obj}',this.value,'${id}')" style="width:220px">`;
const coincide = (q, ...textos) => !q || textos.join(' ').toLowerCase().includes(q.toLowerCase());

/* ==========================================================================
   PROYECTOS
   ========================================================================== */
const Proy = {
  acts: p => S.actividades.filter(a => a.proyecto === p.id),
  avance(p) { const a = this.acts(p); return a.length ? Math.round(a.filter(x => estFinal(x.estatus)).length * 100 / a.length) : (estFinal(p.estatus) ? 100 : (p.avanceManual || 0)); },
  campos: () => [
    { k: 'nombre', label: 'Nombre del proyecto', req: true },
    { k: 'ambito', label: 'Ámbito', tipo: 'select', opciones: AMBITOS, medio: true },
    { k: 'estatus', label: 'Estatus', tipo: 'select', opciones: S.estatus.map(e => [e.id, e.nombre]), medio: true },
    { k: 'asignadoPor', label: 'Asignado por', medio: true, ph: 'Quién te lo asignó' },
    { k: 'prioridad', label: 'Prioridad', tipo: 'select', opciones: PRIORIDADES, medio: true, def: '3' },
    { k: 'inicio', label: 'Fecha de inicio', tipo: 'date', medio: true },
    { k: 'objetivo', label: 'Fecha objetivo', tipo: 'date', medio: true },
    { k: 'avanceManual', label: 'Avance manual (%)', tipo: 'number', min: 0, max: 100, medio: true, ayuda: 'Sólo se usa si el proyecto no tiene actividades.' },
    { k: 'descripcion', label: 'Descripción', tipo: 'textarea', filas: 3 }
  ],
  nuevo() {
    Form.abrir({ titulo: 'Nuevo proyecto', campos: this.campos(), valores: { ambito: 'Trabajo', estatus: idInicial(), inicio: hoyISO() },
      guardar: v => { if (v.inicio && v.objetivo && v.objetivo < v.inicio) return 'La fecha objetivo no puede ser anterior al inicio'; const p = { id: uid(), creado: hoyISO(), ...v }; regEstatus('proyectos', p, '', p.estatus); poner('proyectos', p); toast('Proyecto creado'); } });
  },
  editar(id) {
    const p = por('proyectos', id);
    Form.abrir({ titulo: 'Editar proyecto', campos: this.campos(), valores: p, nota: Hist.de(id),
      guardar: v => { if (v.inicio && v.objetivo && v.objetivo < v.inicio) return 'La fecha objetivo no puede ser anterior al inicio'; regEstatus('proyectos', p, p.estatus, v.estatus); poner('proyectos', { ...p, ...v }); },
      eliminar: async () => {
        for (const b of S.bitacora.filter(b => b.proyecto === id)) for (const i of b.imgs || []) await Img.quitar(i);
        S.bitacora = S.bitacora.filter(b => b.proyecto !== id);
        S.actividades.forEach(a => { if (a.proyecto === id) a.proyecto = ''; });   // las actividades pasan a "del área"
        S.notas.forEach(n => { if (n.proyecto === id) n.proyecto = ''; });         // las notas quedan sin clasificar
        quitar('proyectos', id); toast('Proyecto eliminado; sus actividades y notas se conservaron sin clasificar'); App.ir('proyectos');
      } });
  }
};
Vistas.proyectos = () => {
  let l = S.proyectos.filter(p => UI.proy.f === 'todos' ? true : UI.proy.f === 'activos' ? !estFinal(p.estatus) : estFinal(p.estatus));
  if (UI.proy.amb) l = l.filter(p => p.ambito === UI.proy.amb);
  if (UI.proy.pri) l = l.filter(p => (p.prioridad || '3') === UI.proy.pri);
  l = l.filter(p => coincide(UI.proy.q, p.nombre, p.descripcion, p.asignadoPor));
  l.sort((a, b) => (a.prioridad || '3').localeCompare(b.prioridad || '3') || (a.objetivo || '9').localeCompare(b.objetivo || '9'));
  return `${cab('Proyectos', `${S.proyectos.filter(p => !estFinal(p.estatus)).length} activos de ${S.proyectos.length}`, btnHist('proyectos') + btnCarga('proyectos') + '<button class="btn pri" onclick="Proy.nuevo()">+ Proyecto</button>')}
  <div class="barra">${filtro('proy', 'f', [['activos', 'Activos'], ['terminados', 'Terminados'], ['todos', 'Todos']])}
    <select onchange="UI.proy.amb=this.value;App.pintar()"><option value="">Todos los ámbitos</option>${AMBITOS.map(a => `<option ${UI.proy.amb === a ? 'selected' : ''}>${a}</option>`).join('')}</select>
    <select onchange="UI.proy.pri=this.value;App.pintar()"><option value="">Todas las prioridades</option>${PRIORIDADES.map(([v, t]) => `<option value="${v}" ${UI.proy.pri === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
    ${campoBuscar('proy', 'pBuscar', 'Buscar proyecto…')}<span class="d">${l.length} resultado(s)</span></div>
  <div class="panel scrollx">${l.length ? `<table class="lista"><thead><tr><th>Proyecto</th><th>Ámbito</th><th>Prioridad</th><th>Estatus</th><th>Avance</th><th class="num">Actividades</th><th>Fecha objetivo</th><th>Asignado por</th></tr></thead><tbody>
    ${l.map(p => { const a = Proy.acts(p), h = a.filter(x => estFinal(x.estatus)).length, av = Proy.avance(p), e = por('estatus', p.estatus) || {};
      return `<tr><td><div class="t" onclick="App.ir('proyecto','${p.id}')">${esc(p.nombre)}</div>${p.descripcion ? `<div class="d">${esc(p.descripcion.slice(0, 90))}</div>` : ''}</td>
      <td class="nw">${esc(p.ambito || '')}</td><td class="nw d">${esc((PRIORIDADES.find(x => x[0] === (p.prioridad || '3')) || ['', ''])[1])}</td><td class="nw">${punto(e.color)}${selEstatus('proyectos', p.id, p.estatus)}</td>
      <td><div class="av"><div><i style="width:${av}%"></i></div><span>${av}%</span></div></td><td class="num">${h} / ${a.length}</td>
      <td class="nw">${fechaLim(p.objetivo, estFinal(p.estatus))}</td><td class="nw d">${esc(p.asignadoPor || '—')}</td></tr>`; }).join('')}
    </tbody></table>` : vacio('Sin proyectos en esta vista', 'Crea uno con el botón “+ Proyecto”.')}</div>`;
};

/* ---------- Detalle de proyecto ---------- */
Vistas.proyecto = () => {
  const p = por('proyectos', App.param); if (!p) return vacio('Proyecto no encontrado', '');
  const e = por('estatus', p.estatus) || {}, av = Proy.avance(p), acts = Proy.acts(p);
  const bit = S.bitacora.filter(b => b.proyecto === p.id).sort((a, b) => b.fecha.localeCompare(a.fecha));
  const notas = S.notas.filter(n => n.proyecto === p.id);
  const tab = UI.proy.tab;
  let cuerpo;
  if (tab === 'actividades') cuerpo = `<div class="barra"><input type="text" id="rapida" placeholder="Nueva actividad del proyecto… (Enter para agregar)" style="flex:1;max-width:520px" onkeydown="if(event.key==='Enter')Act.rapida(this.value,'${p.id}')">
      <button class="btn" onclick="Act.nueva('${p.id}')">+ Con detalle</button></div><div class="panel scrollx">${Act.tabla(acts.slice().sort(Act.orden), false)}</div>`;
  else if (tab === 'bitacora') cuerpo = `<div class="panel"><div class="comp">
      <textarea id="bTexto" rows="3" placeholder="¿Qué avanzaste, qué se decidió o qué quedó pendiente?"></textarea>
      <div class="barra" style="margin:0"><select id="bTipo">${Bit.TIPOS.map(t => `<option>${t}</option>`).join('')}</select>
      <input type="file" id="bImgs" accept="image/*" multiple><span class="esp"></span><button class="btn pri" onclick="Bit.agregar('${p.id}')">Registrar</button></div></div>
      ${bit.length ? `<ul class="bit">${bit.map(b => `<li><div class="mt"><span class="et ac">${esc(b.tipo)}</span><span>${esc(fFecha(b.fecha.slice(0, 10)))} · ${esc(b.fecha.slice(11, 16))}</span><span class="esp"></span>
        <button class="lnk gris" onclick="Bit.editar('${b.id}')">Editar</button><button class="lnk gris" onclick="Bit.borrar('${b.id}')">Eliminar</button></div>
        <div class="tx">${esc(b.texto)}</div>${(b.imgs || []).length ? `<div class="minis">${b.imgs.map(i => `<img src="${Img.url(i)}" alt="Imagen de bitácora" onclick="verImagen(this.src)">`).join('')}</div>` : ''}</li>`).join('')}</ul>` : vacio('Bitácora vacía', 'Registra aquí tus avances, decisiones y acuerdos de revisión.')}</div>`;
  else if (tab === 'historial') cuerpo = `<div class="panel scrollx">${Hist.tabla(S.historial.filter(h => h.proyecto === p.id).reverse())}</div>`;
  else cuerpo = `<div class="barra"><button class="btn" onclick="Notas.nueva('${p.id}')">+ Nota del proyecto</button></div>
      <div class="panel">${notas.length ? `<ul class="filas">${notas.map(n => `<li><span class="x clic" onclick="UI.notas.id='${n.id}';UI.notas.f='todas';App.ir('notas')">${esc(n.titulo || 'Sin título')}</span><span class="m">${esc((n.texto || '').slice(0, 70))}</span><span class="m">${esc(fFecha((n.actualizado || '').slice(0, 10)))}</span></li>`).join('')}</ul>` : vacio('Sin notas ligadas', 'Puedes crear una aquí o clasificar una nota general desde “Notas”.')}</div>`;
  return `<div class="miga"><a href="#/proyectos">Proyectos</a> / ${esc(p.ambito || '')}</div>
  ${cab(p.nombre, '', `<button class="btn" onclick="Proy.editar('${p.id}')">Editar</button>`)}
  <div class="panel" style="padding:12px 14px;margin-bottom:14px"><div class="barra" style="margin:0;gap:18px">
    <span>${punto(e.color)}${selEstatus('proyectos', p.id, p.estatus)}</span>
    <div class="av" style="width:200px"><div><i style="width:${av}%"></i></div><span>${av}%</span></div>
    <span class="d">Inicio: <b>${esc(fFecha(p.inicio) || '—')}</b></span><span class="d">Objetivo: <b>${p.objetivo ? esc(fFecha(p.objetivo)) : '—'}</b> ${p.objetivo && !estFinal(p.estatus) && fRel(p.objetivo) !== fFecha(p.objetivo) ? '(' + fechaLim(p.objetivo) + ')' : ''}</span>
    <span class="d">Asignado por: <b>${esc(p.asignadoPor || '—')}</b></span></div>
    ${p.descripcion ? `<div style="margin-top:8px;white-space:pre-wrap">${esc(p.descripcion)}</div>` : ''}</div>
  <div class="tabs">${[['actividades', `Actividades (${acts.length})`], ['bitacora', `Bitácora (${bit.length})`], ['notas', `Notas (${notas.length})`], ['historial', 'Historial de estatus']].map(([k, t]) => `<button class="${tab === k ? 'on' : ''}" onclick="UI.proy.tab='${k}';App.pintar()">${t}</button>`).join('')}</div>
  ${cuerpo}`;
};

/* ---------- Bitácora ---------- */
const Bit = {
  TIPOS: ['Avance', 'Nota', 'Decisión', 'Revisión', 'Pendiente', 'Idea'],
  async agregar(proyecto) {
    const texto = $('#bTexto').value.trim(), archivos = [...$('#bImgs').files];
    if (!texto && !archivos.length) { toast('Escribe algo o adjunta una imagen', 'err'); return; }
    const imgs = [];
    try { for (const a of archivos) imgs.push(await Img.agregar(a)); } catch (e) { toast(e.message, 'err'); }
    const d = new Date();
    poner('bitacora', { id: uid(), proyecto, fecha: `${aISO(d)} ${p2(d.getHours())}:${p2(d.getMinutes())}`, tipo: $('#bTipo').value, texto, imgs });
    App.pintar();
  },
  editar(id) {
    const b = por('bitacora', id);
    Form.abrir({ titulo: 'Editar entrada de bitácora', campos: [{ k: 'tipo', label: 'Tipo', tipo: 'select', opciones: this.TIPOS }, { k: 'texto', label: 'Texto', tipo: 'textarea', filas: 6 }], valores: b,
      guardar: v => { poner('bitacora', { ...b, ...v, editado: hoyISO() }); } });
  },
  borrar(id) { confirmar('¿Eliminar esta entrada de la bitácora y sus imágenes?', async () => { const b = por('bitacora', id); for (const i of b.imgs || []) await Img.quitar(i); quitar('bitacora', id); App.pintar(); }); }
};

/* ==========================================================================
   ACTIVIDADES (de proyecto o del área)
   ========================================================================== */
const Act = {
  orden: (a, b) => (estFinal(a.estatus) - estFinal(b.estatus)) || (a.limite || '9999').localeCompare(b.limite || '9999') || (a.prioridad || '3').localeCompare(b.prioridad || '3'),
  origen(a) { const p = a.proyecto && por('proyectos', a.proyecto); const c = a.categoria && por('categorias', a.categoria); return (p ? p.nombre : 'Área') + (c ? ' · ' + c.nombre : ''); },
  lista: txt => String(txt || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => ({ hecho: /^\[x\]/i.test(l), t: l.replace(/^\[[ x]?\]\s*/i, '') })),
  campos: () => [
    { k: 'titulo', label: 'Actividad', req: true },
    { k: 'proyecto', label: 'Pertenece a', tipo: 'select', opciones: [['', 'Actividad del área (sin proyecto)'], ...S.proyectos.map(p => [p.id, 'Proyecto: ' + p.nombre])], medio: true },
    { k: 'categoria', label: 'Clasificación', tipo: 'select', opciones: [['', 'Sin clasificar'], ...S.categorias.map(c => [c.id, c.nombre])], medio: true },
    { k: 'estatus', label: 'Estatus', tipo: 'select', opciones: S.estatus.map(e => [e.id, e.nombre]), medio: true },
    { k: 'prioridad', label: 'Prioridad', tipo: 'select', opciones: PRIORIDADES, medio: true, def: '3' },
    { k: 'inicio', label: 'Fecha de inicio', tipo: 'date', medio: true },
    { k: 'limite', label: 'Fecha límite', tipo: 'date', medio: true },
    { k: 'hora', label: 'Hora', tipo: 'time', medio: true },
    { k: 'horas', label: 'Horas estimadas', tipo: 'number', min: 0, paso: 0.25, medio: true },
    { k: 'detalle', label: 'Detalle', tipo: 'textarea', filas: 3 },
    { k: 'checklist', label: 'Lista de verificación', tipo: 'textarea', filas: 4, ayuda: 'Un elemento por línea. Escribe [x] al inicio para marcarlo como hecho.' }
  ],
  _validar: v => (v.inicio && v.limite && v.limite < v.inicio) ? 'La fecha límite no puede ser anterior al inicio' : null,
  nueva(proyecto = '') {
    Form.abrir({ titulo: 'Nueva actividad', campos: this.campos(), valores: { proyecto, estatus: idInicial(), prioridad: '3' },
      guardar: v => { const er = this._validar(v); if (er) return er; const a = { id: uid(), creado: hoyISO(), completada: estFinal(v.estatus) ? hoyISO() : '', ...v }; regEstatus('actividades', a, '', a.estatus); poner('actividades', a); } });
  },
  editar(id) {
    const a = por('actividades', id);
    Form.abrir({ titulo: 'Editar actividad', campos: this.campos(), valores: a, nota: Hist.de(id),
      guardar: v => { const er = this._validar(v); if (er) return er; regEstatus('actividades', { ...a, ...v }, a.estatus, v.estatus); poner('actividades', { ...a, ...v, completada: estFinal(v.estatus) ? (a.completada || hoyISO()) : '' }); },
      eliminar: () => quitar('actividades', id) });
  },
  rapida(titulo, proyecto = '') {
    titulo = titulo.trim(); if (!titulo) return;
    const cat = (App.vista === 'inicio' ? S.ajustes.inicioFiltro.cat : UI.act.cat) || '';
    const nueva = { id: uid(), creado: hoyISO(), titulo, proyecto, categoria: cat === '-' ? '' : cat, estatus: idInicial(), prioridad: '3', inicio: '', limite: '', hora: '', horas: null, detalle: '', checklist: '', completada: '' };
    regEstatus('actividades', nueva, '', nueva.estatus); poner('actividades', nueva);
    App.pintar(); const i = $('#rapida'); if (i) i.focus();
  },
  alternar(id, marcado) { cambiarEstatus('actividades', id, marcado ? idFinal() : idInicial()); },
  tabla(l, conOrigen = true) {
    if (!l.length) return vacio('Sin actividades', 'Agrega una con el campo de arriba.');
    return `<table class="lista"><thead><tr><th style="width:30px"></th><th>Actividad</th>${conOrigen ? '<th>Proyecto / clasificación</th>' : '<th>Clasificación</th>'}<th>Prioridad</th><th>Fecha límite</th><th>Estatus</th></tr></thead><tbody>
    ${l.map(a => { const fin = estFinal(a.estatus), ck = this.lista(a.checklist), e = por('estatus', a.estatus) || {}, c = por('categorias', a.categoria);
      return `<tr class="${fin ? 'hecho' : ''}"><td><input type="checkbox" ${fin ? 'checked' : ''} onchange="Act.alternar('${a.id}',this.checked)" aria-label="Terminada"></td>
      <td><span class="t" onclick="Act.editar('${a.id}')">${esc(a.titulo)}</span>${ck.length ? ` <span class="et">${ck.filter(x => x.hecho).length}/${ck.length}</span>` : ''}${a.horas ? ` <span class="d">· ${a.horas} h</span>` : ''}</td>
      <td class="d">${conOrigen ? esc(this.origen(a)) : esc(c ? c.nombre : '—')}</td>
      <td class="nw ${a.prioridad === '1' && !fin ? 'rojo' : a.prioridad === '2' && !fin ? 'ambar' : 'd'}">${esc((PRIORIDADES.find(p => p[0] === a.prioridad) || ['', 'Media'])[1])}</td>
      <td class="nw">${fechaLim(a.limite, fin)}${a.hora ? ` <span class="d">${esc(a.hora)}</span>` : ''}</td>
      <td class="nw">${punto(e.color)}${selEstatus('actividades', a.id, a.estatus)}</td></tr>`; }).join('')}</tbody></table>`;
  }
};
Vistas.actividades = () => {
  const hoy = hoyISO(), f = UI.act.f;
  let l = S.actividades.filter(a => {
    const fin = estFinal(a.estatus);
    if (f === 'pendientes') return !fin; if (f === 'terminadas') return fin; if (f === 'todas') return true;
    if (fin) return false;
    if (f === 'hoy') return a.limite === hoy; if (f === 'vencidas') return a.limite && a.limite < hoy;
    if (f === 'semana') return a.limite && difDias(hoy, a.limite) >= 0 && difDias(hoy, a.limite) <= 7;
  });
  if (UI.act.proy === '-') l = l.filter(a => !a.proyecto); else if (UI.act.proy) l = l.filter(a => a.proyecto === UI.act.proy);
  if (UI.act.cat === '-') l = l.filter(a => !a.categoria); else if (UI.act.cat) l = l.filter(a => a.categoria === UI.act.cat);
  if (UI.act.pri) l = l.filter(a => (a.prioridad || '3') === UI.act.pri);
  l = l.filter(a => coincide(UI.act.q, a.titulo, a.detalle, Act.origen(a)));
  l.sort(Act.orden);
  const proyRapida = UI.act.proy && UI.act.proy !== '-' ? UI.act.proy : '';
  return `${cab('Actividades', `${S.actividades.filter(a => !estFinal(a.estatus)).length} pendientes`, btnHist('actividades') + btnCarga('actividades') + '<button class="btn pri" onclick="Act.nueva()">+ Actividad</button>')}
  <div class="barra">${filtro('act', 'f', [['pendientes', 'Pendientes'], ['hoy', 'Hoy'], ['semana', '7 días'], ['vencidas', 'Vencidas'], ['terminadas', 'Terminadas'], ['todas', 'Todas']])}
    <select onchange="UI.act.proy=this.value;App.pintar()"><option value="">Proyectos y área</option><option value="-" ${UI.act.proy === '-' ? 'selected' : ''}>Sólo actividades del área</option>${S.proyectos.map(p => `<option value="${p.id}" ${UI.act.proy === p.id ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select>
    <select onchange="UI.act.cat=this.value;App.pintar()"><option value="">Todas las clasificaciones</option><option value="-" ${UI.act.cat === '-' ? 'selected' : ''}>Sin clasificar</option>${S.categorias.map(c => `<option value="${c.id}" ${UI.act.cat === c.id ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('')}</select>
    <select onchange="UI.act.pri=this.value;App.pintar()"><option value="">Todas las prioridades</option>${PRIORIDADES.map(([v, t]) => `<option value="${v}" ${UI.act.pri === v ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
  <div class="barra"><input type="text" id="rapida" placeholder="Agregar actividad rápida… (Enter)" style="flex:1;max-width:460px" onkeydown="if(event.key==='Enter')Act.rapida(this.value,'${proyRapida}')">
    ${campoBuscar('act', 'acBuscar', 'Buscar actividad…')}<span class="d">${l.length} resultado(s)</span></div>
  <div class="panel scrollx">${Act.tabla(l)}</div>`;
};

/* ===== 03-escuela-agenda.js ===== */
'use strict';
/* ==========================================================================
   ESCUELA (lista, línea de tiempo, evaluación, materias) + AGENDA + RECORDATORIOS
   ========================================================================== */

const Esc = {
  campos: () => [
    { k: 'titulo', label: 'Actividad', req: true },
    { k: 'materia', label: 'Materia', tipo: 'select', opciones: S.materias.map(m => [m.id, m.nombre]), medio: true },
    { k: 'tipo', label: 'Tipo', tipo: 'select', opciones: TIPOS_ESC, medio: true },
    { k: 'inicio', label: 'Fecha de inicio', tipo: 'date', medio: true },
    { k: 'entrega', label: 'Fecha de entrega', tipo: 'date', medio: true, req: true },
    { k: 'valor', label: 'Valor (puntos)', tipo: 'number', min: 0, max: 100, paso: 0.5, medio: true },
    { k: 'calif', label: 'Calificación obtenida (puntos)', tipo: 'number', min: 0, paso: 0.1, medio: true, ayuda: 'Déjala vacía si aún no te califican.' },
    { k: 'estatus', label: 'Estado', tipo: 'select', opciones: EST_ESC },
    { k: 'comentario', label: 'Comentarios', tipo: 'textarea', filas: 2 }
  ],
  _validar(v) {
    if (v.inicio && v.entrega < v.inicio) return 'La fecha de entrega no puede ser anterior al inicio';
    if (v.calif != null && v.calif > (v.valor || 0)) return 'La calificación no puede ser mayor al valor de la actividad';
    if (v.calif != null) v.estatus = 'calificada';
    return null;
  },
  nueva() {
    if (!S.materias.length) { toast('Primero registra una materia'); UI.esc.tab = 'materias'; App.pintar(); return this.materia(); }
    Form.abrir({ titulo: 'Nueva actividad escolar', campos: this.campos(), valores: { materia: UI.esc.mat || S.materias[0].id, tipo: 'Buzón', estatus: 'pendiente', inicio: hoyISO(), valor: 0 },
      guardar: v => { const er = this._validar(v); if (er) return er; const e = { id: uid(), ...v }; regEstatus('escolares', e, '', e.estatus); poner('escolares', e); } });
  },
  editar(id) {
    const e = por('escolares', id);
    Form.abrir({ titulo: 'Editar actividad escolar', campos: this.campos(), valores: e, nota: Hist.de(id),
      guardar: v => { const er = this._validar(v); if (er) return er; regEstatus('escolares', e, e.estatus, v.estatus); poner('escolares', { ...e, ...v }); }, eliminar: () => quitar('escolares', id) });
  },
  estado(id, v) { const e = por('escolares', id); regEstatus('escolares', e, e.estatus, v); e.estatus = v; if (v !== 'calificada') e.calif = null; guardar(); App.pintar(); },
  calificar(id, txt) {
    const e = por('escolares', id), n = txt === '' ? null : Number(txt);
    if (n != null && (isNaN(n) || n < 0 || n > (e.valor || 0))) { toast(`La calificación debe estar entre 0 y ${e.valor || 0}`, 'err'); App.pintar(); return; }
    const antes = e.estatus; e.calif = n; if (n != null) e.estatus = 'calificada'; else if (e.estatus === 'calificada') e.estatus = 'enviada';
    regEstatus('escolares', e, antes, e.estatus);
    guardar(); App.pintar();
  },
  materia(id) {
    const m = id ? por('materias', id) : null;
    Form.abrir({ titulo: m ? 'Editar materia' : 'Nueva materia', valores: m || { color: PALETA[S.materias.length % PALETA.length], meta: S.ajustes.metaEscolar },
      campos: [{ k: 'nombre', label: 'Materia', req: true }, { k: 'profesor', label: 'Profesor(a)', medio: true }, { k: 'ciclo', label: 'Ciclo', medio: true, ph: '2026-B' },
               { k: 'color', label: 'Color', tipo: 'color', medio: true }, { k: 'meta', label: 'Meta de calificación', tipo: 'number', min: 0, max: 100, medio: true, ayuda: 'Puntos que quieres alcanzar al final.' }],
      guardar: v => { poner('materias', { id: m ? m.id : uid(), ...v }); },
      eliminar: m ? () => { S.escolares = S.escolares.filter(e => e.materia !== m.id); quitar('materias', m.id); toast('Materia y sus actividades eliminadas'); } : null });
  },
  /** Modelo de evaluación: puntos totales, evaluados, obtenidos y proyección. */
  resumen(m) {
    const a = S.escolares.filter(e => e.materia === m.id && e.tipo !== 'Vacaciones' && e.valor > 0);
    const total = a.reduce((s, e) => s + e.valor, 0), ev = a.filter(e => e.calif != null);
    const evaluado = ev.reduce((s, e) => s + e.valor, 0), obtenido = ev.reduce((s, e) => s + e.calif, 0);
    const rend = evaluado ? obtenido / evaluado : null, restante = total - evaluado, meta = m.meta ?? S.ajustes.metaEscolar;
    return { a, total, evaluado, obtenido, rend, restante, meta, perdido: evaluado - obtenido, proy: rend == null ? null : obtenido + restante * rend,
             entregadas: a.filter(e => ['enviada', 'calificada'].includes(e.estatus)).length };
  }
};
const r1 = n => Math.round(n * 10) / 10;

Vistas.escuela = () => {
  const t = UI.esc.tab;
  const selMat = `<select onchange="UI.esc.mat=this.value;App.pintar()"><option value="">Todas las materias</option>${S.materias.map(m => `<option value="${m.id}" ${UI.esc.mat === m.id ? 'selected' : ''}>${esc(m.nombre)}</option>`).join('')}</select>`;
  const cuerpo = t === 'lista' ? escLista(selMat) : t === 'tiempo' ? escTiempo(selMat) : t === 'eval' ? escEval(selMat) : escMaterias();
  return `${cab('Escuela', `${S.materias.length} materias · ${S.escolares.filter(e => e.tipo !== 'Vacaciones').length} actividades`, btnHist('escolares') + btnCarga(t === 'materias' ? 'materias' : 'escolares') + '<button class="btn" onclick="Esc.materia()">+ Materia</button><button class="btn pri" onclick="Esc.nueva()">+ Actividad</button>')}
  <div class="tabs">${[['lista', 'Actividades'], ['tiempo', 'Línea de tiempo'], ['eval', 'Evaluación'], ['materias', 'Materias']].map(([k, n]) => `<button class="${t === k ? 'on' : ''}" onclick="UI.esc.tab='${k}';App.pintar()">${n}</button>`).join('')}</div>${cuerpo}`;
};

function escLista(selMat) {
  let l = S.escolares.filter(e => (!UI.esc.mat || e.materia === UI.esc.mat));
  const f = UI.esc.est;
  if (f === 'abiertas') l = l.filter(e => ['pendiente', 'proceso', 'guardada'].includes(e.estatus) && e.tipo !== 'Vacaciones'); else if (f) l = l.filter(e => e.estatus === f);
  if (UI.esc.tipo) l = l.filter(e => e.tipo === UI.esc.tipo);
  l = l.filter(e => coincide(UI.esc.q, e.titulo, e.comentario, (por('materias', e.materia) || {}).nombre));
  l.sort((a, b) => (a.entrega || '').localeCompare(b.entrega || ''));
  return `<div class="barra">${selMat}<select onchange="UI.esc.est=this.value;App.pintar()"><option value="">Todos los estados</option><option value="abiertas" ${f === 'abiertas' ? 'selected' : ''}>Por entregar</option>${EST_ESC.map(([k, n]) => `<option value="${k}" ${f === k ? 'selected' : ''}>${n}</option>`).join('')}</select>
    <select onchange="UI.esc.tipo=this.value;App.pintar()"><option value="">Todos los tipos</option>${TIPOS_ESC.map(x => `<option ${UI.esc.tipo === x ? 'selected' : ''}>${x}</option>`).join('')}</select>
    ${campoBuscar('esc', 'eBuscar', 'Buscar actividad…')}<span class="d">${l.length} resultado(s) · ${r1(l.reduce((s, e) => s + (e.valor || 0), 0))} pts</span></div>
  <div class="panel scrollx">${l.length ? `<table class="lista"><thead><tr><th>Actividad</th><th>Materia</th><th>Tipo</th><th class="num">Valor</th><th>Inicio</th><th>Entrega</th><th>Estado</th><th class="num">Calificación</th></tr></thead><tbody>
    ${l.map(e => { const m = por('materias', e.materia) || {}, cerr = ['enviada', 'calificada'].includes(e.estatus) || e.tipo === 'Vacaciones';
      return `<tr class="${cerr && e.tipo !== 'Vacaciones' ? 'hecho' : ''}"><td><span class="t" onclick="Esc.editar('${e.id}')">${esc(e.titulo)}</span></td><td class="nw">${punto(m.color)}${esc(m.nombre || '')}</td><td class="d nw">${esc(e.tipo || '')}</td>
      <td class="num">${e.valor ? e.valor + ' pts' : '—'}</td><td class="d nw">${esc(fFecha(e.inicio))}</td><td class="nw">${fechaLim(e.entrega, cerr)}</td>
      <td>${e.tipo === 'Vacaciones' ? '<span class="d">—</span>' : `<select onchange="Esc.estado('${e.id}',this.value)">${EST_ESC.map(([k, n]) => `<option value="${k}" ${e.estatus === k ? 'selected' : ''}>${n}</option>`).join('')}</select>`}</td>
      <td class="num">${e.valor ? `<input type="number" min="0" max="${e.valor}" step="0.1" value="${e.calif ?? ''}" onchange="Esc.calificar('${e.id}',this.value)" aria-label="Calificación">` : ''}</td></tr>`; }).join('')}
    </tbody></table>` : vacio('Sin actividades escolares', 'Agrégalas una por una o impórtalas por CSV en Ajustes → Datos.')}</div>`;
}

/* ---------- Línea de tiempo (versión mejorada de AcadTrack) ---------- */
function escTiempo(selMat) {
  const W = 26, hoy = hoyISO(), [y, mm] = UI.esc.mes.split('-').map(Number);
  const fechas = S.escolares.flatMap(e => [e.inicio, e.entrega]).filter(Boolean).sort();
  let ini, fin;
  if (UI.esc.rango === 'mes') { ini = `${UI.esc.mes}-01`; fin = aISO(new Date(y, mm, 0)); }
  else if (UI.esc.rango === 'tri') { ini = `${UI.esc.mes}-01`; fin = aISO(new Date(y, mm + 2, 0)); }
  else { ini = sumaDias(fechas[0] || hoy, -2); fin = sumaDias(fechas[fechas.length - 1] || hoy, 2); }
  const n = difDias(ini, fin) + 1, ancho = n * W;
  const mats = S.materias.filter(m => !UI.esc.mat || m.id === UI.esc.mat);
  const visibles = S.escolares.filter(e => mats.some(m => m.id === e.materia) && e.entrega && (e.inicio || e.entrega) <= fin && e.entrega >= ini);
  // Encabezado: meses, días y conteo de entregas por día
  let meses = '', dias = '', carga = '', mesAnt = '';
  for (let i = 0; i < n; i++) {
    const iso = sumaDias(ini, i), d = deISO(iso), ds = d.getDay();
    if (iso.slice(0, 7) !== mesAnt) { mesAnt = iso.slice(0, 7); meses += `<div class="mescel" style="left:${i * W}px">${MESES_C[d.getMonth()]} ${d.getFullYear()}</div>`; }
    dias += `<div class="dcel ${ds === 0 || ds === 6 ? 'fs' : ''} ${iso === hoy ? 'hoy' : ''}" style="left:${i * W}px;width:${W}px"><b>${d.getDate()}</b>${'DLMMJVS'[ds]}</div>`;
    const c = visibles.filter(e => e.entrega === iso && e.tipo !== 'Vacaciones').length;
    if (c) carga += `<div class="ccel" title="${c} entrega(s) el ${esc(fFecha(iso))}" style="left:${i * W + 2}px;width:${W - 4}px;background:${c >= 3 ? 'var(--bad)' : c === 2 ? 'var(--warn)' : 'var(--ac-s)'};color:${c >= 2 ? '#fff' : 'var(--ac)'}">${c}</div>`;
  }
  const filas = mats.map(m => {
    const its = visibles.filter(e => e.materia === m.id).sort((a, b) => (a.inicio || a.entrega).localeCompare(b.inicio || b.entrega));
    const carriles = []; let barras = '';
    for (const e of its) {
      const a = Math.max(0, difDias(ini, e.inicio || e.entrega)), b = Math.min(n - 1, difDias(ini, e.entrega));
      let c = carriles.findIndex(f => f < a); if (c < 0) { c = carriles.length; carriles.push(-1); } carriles[c] = b;
      barras += `<div class="bar ${e.tipo === 'Vacaciones' ? 'vac' : esc(e.estatus)}" onclick="Esc.editar('${e.id}')" title="${esc(e.titulo)} · ${esc(fFecha(e.inicio))} → ${esc(fFecha(e.entrega))}${e.valor ? ' · ' + e.valor + ' pts' : ''}"
        style="left:${a * W + 1}px;width:${(b - a + 1) * W - 2}px;top:${c * 24 + 5}px;background:${esc(m.color)}">${['enviada', 'calificada'].includes(e.estatus) ? '✓ ' : ''}${esc(e.titulo)}</div>`;
    }
    return `<div class="fila"><div class="rot">${punto(m.color)}<span title="${esc(m.nombre)}">${esc(m.nombre)}</span></div><div class="pista" style="width:${ancho}px;height:${Math.max(1, carriles.length) * 24 + 8}px;background-size:${W}px 100%">${barras}</div></div>`;
  }).join('');
  const posHoy = hoy >= ini && hoy <= fin ? 170 + difDias(ini, hoy) * W + W / 2 : '';
  const etMes = `${MESES[mm - 1]} ${y}`;
  const mover = k => { const d = new Date(y, mm - 1 + k, 1); return `${d.getFullYear()}-${p2(d.getMonth() + 1)}`; };
  return `<div class="barra">${selMat}${filtro('esc', 'rango', [['mes', 'Mes'], ['tri', '3 meses'], ['todo', 'Todo el ciclo']])}
    ${UI.esc.rango !== 'todo' ? `<button class="btn ch" onclick="UI.esc.mes='${mover(-1)}';App.pintar()">‹</button><b style="min-width:120px;text-align:center">${may(etMes)}</b><button class="btn ch" onclick="UI.esc.mes='${mover(1)}';App.pintar()">›</button>
    <button class="btn ch" onclick="UI.esc.mes='${hoy.slice(0, 7)}';App.pintar()">Hoy</button>` : ''}</div>
  ${mats.length ? `<div class="tl" id="tl" data-hoy="${posHoy}"><div class="in" style="width:${ancho + 170}px">
    <div class="fila cabz"><div class="rot mut">Materia</div><div class="pista" style="width:${ancho}px;height:52px;background-image:none">${meses}${dias}</div></div>
    <div class="fila"><div class="rot mut">Entregas por día</div><div class="pista" style="width:${ancho}px;height:26px;background-size:${W}px 100%">${carga}</div></div>
    ${filas}${posHoy ? `<div class="hoyl" style="left:${posHoy}px"></div>` : ''}</div></div>
    <div class="ley"><span><i></i>Pendiente</span><span><i style="background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.5) 0 4px,transparent 4px 8px)"></i>En proceso</span><span><i style="opacity:.7"></i>Guardada</span><span><i style="opacity:.38"></i>Enviada / calificada</span>
    <span>Entregas por día: <b style="color:var(--ac)">1</b> · <b class="ambar">2</b> · <b class="rojo">3 o más</b></span></div>` : `<div class="panel">${vacio('Sin materias', 'Registra tus materias para ver la línea de tiempo.')}</div>`}`;
}

/* ---------- Modelo de evaluación ---------- */
function escEval(selMat) {
  const mats = S.materias.filter(m => !UI.esc.mat || m.id === UI.esc.mat);
  if (!mats.length) return `<div class="panel">${vacio('Sin materias', 'Registra tus materias y actividades con su valor en puntos.')}</div>`;
  return `<div class="barra">${selMat}<span class="d">La calificación se captura en puntos (0 al valor de cada actividad). La proyección supone que mantienes tu rendimiento actual.</span></div>
  <div class="panel">${mats.map(m => {
    const r = Esc.resumen(m), T = r.total || 1;
    const falta = r.meta - r.obtenido;
    const msg = !r.total ? '<span class="mut">Sin actividades con valor.</span>'
      : falta <= 0 ? `<span class="verde">Meta de ${r.meta} alcanzada.</span>`
      : falta > r.restante ? `<span class="rojo">La meta de ${r.meta} ya no es alcanzable: máximo posible ${r1(r.obtenido + r.restante)}.</span>`
      : `Para llegar a ${r.meta} necesitas <b>${r1(falta)}</b> de los <b>${r1(r.restante)}</b> puntos por evaluar (${Math.round(falta * 100 / r.restante)} %).`;
    return `<div class="eval"><div class="ln">${punto(m.color)}<span class="nm">${esc(m.nombre)}</span>${m.profesor ? `<span class="d">${esc(m.profesor)}</span>` : ''}<span class="esp"></span>
      ${r.total && Math.abs(r.total - 100) > 0.01 ? `<span class="et" title="Normalmente los valores de una materia suman 100">Los valores suman ${r1(r.total)}</span>` : ''}<button class="lnk gris" onclick="Esc.materia('${m.id}')">Editar materia</button></div>
      <div class="kp"><div><b>${r1(r.obtenido)}</b>puntos obtenidos</div><div><b>${r1(r.evaluado)}</b>puntos evaluados</div><div><b>${r.rend == null ? '—' : Math.round(r.rend * 100) + ' %'}</b>rendimiento</div>
        <div><b>${r.proy == null ? '—' : r1(r.proy)}</b>proyección final</div><div><b>${r.entregadas} / ${r.a.length}</b>actividades entregadas</div></div>
      <div class="pila" title="Obtenido / perdido / por evaluar"><i style="width:${r.obtenido * 100 / T}%;background:var(--ok)"></i><i style="width:${r.perdido * 100 / T}%;background:var(--bad);opacity:.55"></i>
        ${r.total ? `<span class="meta" data-t="Meta ${r.meta}" style="left:${Math.min(100, r.meta * 100 / T)}%"></span>` : ''}</div>
      <div style="margin-top:10px;font-size:13px">${msg}</div>
      ${r.a.length ? `<div class="scrollx" style="margin-top:10px"><table class="lista"><thead><tr><th>Actividad</th><th>Tipo</th><th>Entrega</th><th>Estado</th><th class="num">Valor</th><th class="num">Calificación</th><th class="num">%</th></tr></thead><tbody>
        ${r.a.slice().sort((a, b) => a.entrega.localeCompare(b.entrega)).map(e => `<tr><td><span class="t" onclick="Esc.editar('${e.id}')">${esc(e.titulo)}</span></td><td class="d">${esc(e.tipo)}</td><td class="d nw">${esc(fFecha(e.entrega))}</td>
          <td class="d">${esc((EST_ESC.find(x => x[0] === e.estatus) || ['', ''])[1])}</td><td class="num">${e.valor}</td>
          <td class="num"><input type="number" min="0" max="${e.valor}" step="0.1" value="${e.calif ?? ''}" onchange="Esc.calificar('${e.id}',this.value)" aria-label="Calificación"></td>
          <td class="num ${e.calif != null && e.calif / e.valor < 0.6 ? 'rojo' : ''}">${e.calif != null ? Math.round(e.calif * 100 / e.valor) + ' %' : '—'}</td></tr>`).join('')}</tbody></table></div>` : ''}</div>`; }).join('')}</div>`;
}

function escMaterias() {
  return `<div class="panel scrollx">${S.materias.length ? `<table class="lista"><thead><tr><th>Materia</th><th>Profesor(a)</th><th>Ciclo</th><th class="num">Actividades</th><th class="num">Puntos</th><th class="num">Meta</th><th></th></tr></thead><tbody>
    ${S.materias.map(m => { const r = Esc.resumen(m); return `<tr><td>${punto(m.color)}<span class="t" onclick="Esc.materia('${m.id}')">${esc(m.nombre)}</span></td><td class="d">${esc(m.profesor || '—')}</td><td class="d">${esc(m.ciclo || '—')}</td>
      <td class="num">${r.a.length}</td><td class="num">${r1(r.obtenido)} / ${r1(r.total)}</td><td class="num">${r.meta}</td><td class="num"><button class="lnk" onclick="UI.esc.mat='${m.id}';UI.esc.tab='eval';App.pintar()">Ver evaluación</button></td></tr>`; }).join('')}</tbody></table>`
    : vacio('Sin materias', 'Agrega tus materias con el botón “+ Materia”.')}</div>`;
}

/* ==========================================================================
   AGENDA
   ========================================================================== */
const Agenda = {
  TIPOS: ['Reunión', 'Revisión', 'Clase', 'Personal', 'Otro'],
  /** Todo lo que ocurre en un día: eventos, actividades, entregas, cumpleaños y recordatorios. */
  items(iso, todo) {
    const [, m, d] = iso.split('-').map(Number), r = [], ambP = id => (por('proyectos', id) || {}).ambito;
    for (const e of S.eventos) if (e.fecha === iso) r.push({ clase: 'evento', amb: e.tipo === 'Personal' ? 'Personal' : e.tipo === 'Clase' ? 'Escuela' : (ambP(e.proyecto) || 'Trabajo'), hora: e.horaIni || '', titulo: e.titulo + (e.lugar ? ' · ' + e.lugar : ''), tipo: e.tipo || 'Evento', color: 'var(--ac)', clic: `Agenda.evento('${e.id}')`, peso: 1 });
    for (const a of S.actividades) if (a.limite === iso && !estFinal(a.estatus)) r.push({ clase: 'actividad', amb: ambAct(a), cat: a.categoria || '', hora: a.hora || '', titulo: a.titulo, tipo: 'Actividad', color: (por('estatus', a.estatus) || {}).color, clic: `Act.editar('${a.id}')`, peso: 1 });
    for (const e of S.escolares) if (e.entrega === iso && e.tipo !== 'Vacaciones') r.push({ clase: 'entrega', amb: 'Escuela', hora: '', titulo: e.titulo, tipo: 'Entrega', color: (por('materias', e.materia) || {}).color, clic: `Esc.editar('${e.id}')`, peso: ['enviada', 'calificada'].includes(e.estatus) ? 0 : 1 });
    for (const c of S.cumples) if (c.dia === d && c.mes === m) r.push({ clase: 'cumple', amb: 'Personal', hora: '', titulo: 'Cumpleaños de ' + c.nombre, tipo: 'Cumpleaños', color: '#db2777', clic: `Cumples.editar('${c.id}')`, peso: 0 });
    for (const x of S.recordatorios) if (!x.hecho && Rec.ocurre(x, iso)) r.push({ clase: 'recordatorio', amb: '', hora: x.hora || '', titulo: x.texto, tipo: 'Recordatorio', color: 'var(--oro)', clic: `Rec.editar('${x.id}')`, peso: 0 });
    return r.sort((a, b) => (a.hora || '00:00').localeCompare(b.hora || '00:00'));
  },

const Rec = {
  REP: [['', 'No se repite'], ['diario', 'Cada día'], ['semanal', 'Cada semana'], ['mensual', 'Cada mes'], ['anual', 'Cada año']],
  ocurre(r, iso) {
    if (iso < r.fecha) return false; if (iso === r.fecha) return true; if (!r.repetir) return false;
    const a = deISO(r.fecha), b = deISO(iso);
    return r.repetir === 'diario' || (r.repetir === 'semanal' && a.getDay() === b.getDay()) || (r.repetir === 'mensual' && a.getDate() === b.getDate()) || (r.repetir === 'anual' && a.getDate() === b.getDate() && a.getMonth() === b.getMonth());
  },
  /** Siguiente fecha (posterior a hoy) de un recordatorio que se repite. */
  siguiente(r) { let f = r.fecha; const hoy = hoyISO(); for (let i = 0; i < 800; i++) { f = sumaDias(f, 1); if (f > hoy && this.ocurre(r, f)) return f; } return f; },
  editar(id, fecha) {
    const r = id ? por('recordatorios', id) : null;
    Form.abrir({ titulo: r ? 'Editar recordatorio' : 'Nuevo recordatorio', valores: r || { fecha: fecha || hoyISO(), hora: '09:00', repetir: '' },
      campos: [{ k: 'texto', label: 'Recordarme', req: true }, { k: 'fecha', label: 'Fecha', tipo: 'date', req: true, medio: true }, { k: 'hora', label: 'Hora', tipo: 'time', medio: true }, { k: 'repetir', label: 'Repetición', tipo: 'select', opciones: this.REP }],
      guardar: v => { poner('recordatorios', { id: r ? r.id : uid(), hecho: r ? r.hecho : false, ...v, avisado: '' }); }, eliminar: r ? () => quitar('recordatorios', r.id) : null });
  },
  hecho(id) {
    const r = por('recordatorios', id);
    if (r.repetir && !r.hecho) { r.fecha = this.siguiente(r); r.avisado = ''; toast('Listo. Próximo aviso: ' + fFecha(r.fecha)); } else r.hecho = !r.hecho;
    guardar(); App.pintar();
  },
  /** Revisa cada 30 s si algún recordatorio ya llegó a su hora y avisa una sola vez. */
  revisar() {
    const d = new Date(), ahora = `${aISO(d)} ${p2(d.getHours())}:${p2(d.getMinutes())}`; let cambio = false;
    for (const r of S.recordatorios) {
      if (r.hecho || r.avisado === r.fecha) continue;
      if (`${r.fecha} ${r.hora || '00:00'}` <= ahora) {
        r.avisado = r.fecha; cambio = true; toast('Recordatorio: ' + r.texto);
        if ('Notification' in window && Notification.permission === 'granted') { try { new Notification(S.ajustes.nombre, { body: r.texto }); } catch (e) { /* sin soporte */ } }
      }
    }
    if (cambio) { guardar(); if (['inicio', 'recordatorios'].includes(App.vista) && !$('#modal').classList.contains('on')) App.pintar(); }
  },
  async permiso() {
    if (!('Notification' in window)) return toast('Este navegador no admite notificaciones', 'err');
    const p = await Notification.requestPermission(); toast(p === 'granted' ? 'Notificaciones activadas' : 'No se concedió el permiso', p === 'granted' ? '' : 'err'); App.pintar();
  }
};
Vistas.recordatorios = () => {

const Cumples = {
  proximos() {
    const hoy = hoyISO(), y = +hoy.slice(0, 4);
    return S.cumples.map(c => {
      let f = aISO(new Date(y, c.mes - 1, c.dia)); if (f < hoy) f = aISO(new Date(y + 1, c.mes - 1, c.dia));
      return { ...c, fecha: f, faltan: difDias(hoy, f), edad: c.anio ? +f.slice(0, 4) - c.anio : null };
    }).sort((a, b) => a.faltan - b.faltan);
  },
  editar(id) {
    const c = id ? por('cumples', id) : null;
    Form.abrir({ titulo: c ? 'Editar cumpleaños' : 'Nuevo cumpleaños', valores: c || { mes: new Date().getMonth() + 1 },
      campos: [{ k: 'nombre', label: 'Nombre', req: true }, { k: 'dia', label: 'Día', tipo: 'number', min: 1, max: 31, req: true, medio: true },
               { k: 'mes', label: 'Mes', tipo: 'select', opciones: MESES.map((m, i) => [i + 1, m]), medio: true }, { k: 'anio', label: 'Año de nacimiento (opcional)', tipo: 'number', min: 1900, max: 2100, medio: true },
               { k: 'relacion', label: 'Relación', medio: true, ph: 'Familia, amigos, trabajo…' }, { k: 'nota', label: 'Notas / ideas de regalo', tipo: 'textarea', filas: 2 }],
      guardar: v => { v.mes = +v.mes; if (v.dia > new Date(2024, v.mes, 0).getDate()) return 'Ese día no existe en el mes elegido'; poner('cumples', { id: c ? c.id : uid(), ...v }); },
      eliminar: c ? () => quitar('cumples', c.id) : null });
  }
};
Vistas.cumples = () => {
  const todos = Cumples.proximos(), rels = [...new Set(S.cumples.map(c => c.relacion).filter(Boolean))].sort();
  const l = todos.filter(c => (!UI.cum.rel || c.relacion === UI.cum.rel) && coincide(UI.cum.q, c.nombre, c.nota, c.relacion));
  return `${cab('Cumpleaños', `${todos.length} personas · ${todos.filter(c => c.faltan <= 30).length} en los próximos 30 días`, btnCarga('cumples') + '<button class="btn pri" onclick="Cumples.editar()">+ Cumpleaños</button>')}

  <div class="panel scrollx">${l.length ? `<table class="lista"><thead><tr><th>Nombre</th><th>Fecha</th><th>Faltan</th><th>Cumple</th><th>Relación</th><th>Notas</th></tr></thead><tbody>
    ${l.map(c => `<tr><td><span class="t" onclick="Cumples.editar('${c.id}')">${esc(c.nombre)}</span></td><td class="nw">${c.dia} de ${MESES[c.mes - 1]}</td>
      <td class="nw ${c.faltan === 0 ? 'rojo' : c.faltan <= 7 ? 'ambar' : ''}">${c.faltan === 0 ? '<b>Hoy</b>' : c.faltan === 1 ? 'Mañana' : c.faltan + ' días'}</td>
      <td class="d">${c.edad ? c.edad + ' años' : '—'}</td><td class="d">${esc(c.relacion || '—')}</td><td class="d">${esc(c.nota || '')}</td></tr>`).join('')}</tbody></table>`

/* ==========================================================================
   FRASES DEL DÍA (texto y/o imagen; cambia cada día)
   ========================================================================== */
const Frases = {
  editar(id) {
    const f = id ? por('frases', id) : null;
    Form.abrir({ titulo: f ? 'Editar frase' : 'Nueva frase del día', valores: f || {},
      campos: [{ k: 'texto', label: 'Frase', tipo: 'textarea', filas: 3, ayuda: 'Puedes dejarla vacía si la imagen ya contiene el texto.' }, { k: 'autor', label: 'Autor' },
               { k: 'archivo', label: f && f.img ? 'Cambiar imagen' : 'Imagen', tipo: 'imagen', actual: f ? Img.url(f.img) : '' }],
      guardar: async v => {
        if (!v.texto && !v.archivo && !(f && f.img)) return 'Escribe una frase o elige una imagen';
        let img = f ? f.img : null;
        if (v.archivo) { const nueva = await Img.agregar(v.archivo, 1800); if (img) await Img.quitar(img); img = nueva; }
        poner('frases', { id: f ? f.id : uid(), texto: v.texto, autor: v.autor, img });
      },
      eliminar: f ? async () => { await Img.quitar(f.img); quitar('frases', f.id); } : null });
  },
  /** Carga varias imágenes de una vez: cada una se convierte en una frase. */
  async varias(input) {
    let n = 0;
    for (const a of input.files) { try { const img = await Img.agregar(a, 1800); S.frases.push({ id: uid(), texto: '', autor: '', img }); n++; } catch (e) { toast(e.message, 'err'); } }
    input.value = ''; if (n) { guardar(); App.pintar(); toast(`${n} imagen(es) agregada(s)`); }
  }
};
Vistas.frases = () => {
  const hoy = fraseDelDia();
  return `${cab('Frases del día', `${S.frases.length} cargadas · se muestra una distinta cada día en Inicio`,
    '<input type="file" id="fVarias" accept="image/*" multiple hidden onchange="Frases.varias(this)"><button class="btn" onclick="document.getElementById(\'fVarias\').click()">Subir varias imágenes</button>' + btnCarga('frases') + '<button class="btn pri" onclick="Frases.editar()">+ Frase</button>')}
  <div class="panel scrollx">${S.frases.length ? `<table class="lista"><thead><tr><th style="width:110px">Imagen</th><th>Frase</th><th>Autor</th><th></th></tr></thead><tbody>
    ${S.frases.map(f => `<tr><td>${f.img ? `<img src="${Img.url(f.img)}" alt="" style="height:48px;width:86px;object-fit:cover;border-radius:5px;display:block;cursor:zoom-in" onclick="verImagen(this.src)">` : '<span class="mut">—</span>'}</td>
      <td><span class="t" onclick="Frases.editar('${f.id}')">${esc(f.texto || '(sólo imagen)')}</span></td><td class="d">${esc(f.autor || '')}</td><td class="num">${hoy && hoy.id === f.id ? '<span class="et ac">Hoy</span>' : ''}</td></tr>`).join('')}</tbody></table>`
    : vacio('Aún no hay frases', 'Sube imágenes o escribe frases; cada día verás una diferente en la pantalla de Inicio.')}</div>`;
};

'use strict';
/* ==========================================================================
   AJUSTES (apariencia, catálogos, seguridad) + DATOS (exportar, importar, respaldo)
   ========================================================================== */
const Aj = {
  texto(k, v) { S.ajustes[k] = v.trim() || (k === 'nombre' ? 'Nova Organización' : ''); guardar(); aplicarTema(); App.pintar(); },
  numero(k, v, min, max) { const n = Math.min(max, Math.max(min, Number(v) || min)); S.ajustes[k] = n; guardar(); aplicarTema(); },
  preset(id) { S.ajustes.temaId = id; S.ajustes.tema = temaDe(id); guardar(); aplicarTema(); App.pintar(); },
  escala(v) { S.ajustes.escala = Number(v); guardar(); aplicarTema(); App.pintar(); },
  /* --- Bloques de Inicio: orden, tamaño, filas y periodo --- */
  wMover(i, d) { const l = S.ajustes.inicio, j = i + d; if (j < 0 || j >= l.length) return; [l[i], l[j]] = [l[j], l[i]]; guardar(); App.pintar(); },
  wSet(i, k, v) { S.ajustes.inicio[i][k] = k === 'on' ? v : Number(v); guardar(); App.pintar(); },
  wRestablecer() { S.ajustes.inicio = inicioDefecto(); guardar(); App.pintar(); toast('Inicio restablecido'); },
  color(k, v) { S.ajustes.tema[k] = v; S.ajustes.temaId = 'personal'; guardar(); aplicarTema(); App.pintar(); },
  async imagen(campo, input) {
    const a = input.files[0]; if (!a) return;
    try { const id = await Img.agregar(a, 2200); await Img.quitar(S.ajustes[campo]); S.ajustes[campo] = id; guardar(); aplicarTema(); App.pintar(); }
    catch (e) { toast(e.message, 'err'); }
  },
  async quitarImagen(campo) { await Img.quitar(S.ajustes[campo]); S.ajustes[campo] = null; guardar(); aplicarTema(); App.pintar(); },
  estatus(id) {
    const e = id ? por('estatus', id) : null;
    Form.abrir({ titulo: e ? 'Editar estatus' : 'Nuevo estatus', valores: e || { color: '#64748b' },
      campos: [{ k: 'nombre', label: 'Nombre', req: true }, { k: 'color', label: 'Color', tipo: 'color', medio: true }, { k: 'final', label: 'Tipo', tipo: 'check', texto: 'Es un estatus final (cuenta como terminado)', medio: true }],
      guardar: v => {
        if (!v.final && !S.estatus.some(x => x.final && x.id !== (e && e.id))) return 'Debe existir al menos un estatus final';
        if (v.final && !S.estatus.some(x => !x.final && x.id !== (e && e.id))) return 'Debe existir al menos un estatus no final';
        poner('estatus', { id: e ? e.id : uid(), ...v });
      },
      eliminar: e ? () => {
        const enUso = S.proyectos.some(p => p.estatus === e.id) || S.actividades.some(a => a.estatus === e.id);
        const resto = S.estatus.filter(x => x.id !== e.id);
        if (enUso) return toast('No se puede eliminar: hay proyectos o actividades con este estatus', 'err');
        if (!resto.some(x => x.final) || !resto.some(x => !x.final)) return toast('Debe quedar al menos un estatus final y uno no final', 'err');
        quitar('estatus', e.id);
      } : null });
  },
  categoria(id) {
    const c = id ? por('categorias', id) : null;
    Form.abrir({ titulo: c ? 'Editar clasificación' : 'Nueva clasificación', valores: c || { color: PALETA[S.categorias.length % PALETA.length] },
      campos: [{ k: 'nombre', label: 'Nombre', req: true }, { k: 'color', label: 'Color', tipo: 'color' }],
      guardar: v => { poner('categorias', { id: c ? c.id : uid(), ...v }); },
      eliminar: c ? () => { S.actividades.forEach(a => { if (a.categoria === c.id) a.categoria = ''; }); quitar('categorias', c.id); } : null });
  },
  async cambiarClave() {
    if (!Boveda.abierta()) return toast('Desbloquea primero tus notas privadas (Notas → Privadas)', 'err');
    const a = $('#ncA').value, b = $('#ncB').value;
    if (a.length < 8) return toast('La contraseña debe tener al menos 8 caracteres', 'err');
    if (a !== b) return toast('Las contraseñas no coinciden', 'err');
    await Boveda.cambiarClave(a); App.pintar(); toast('Contraseña actualizada; las notas se volvieron a cifrar');
  }
};

/** Genera una imagen de degradado (para que las frases de ejemplo tengan imagen). */
async function imagenDegradado(c1, c2) {
  const cv = document.createElement('canvas'); cv.width = 1400; cv.height = 420; const x = cv.getContext('2d');
  const g = x.createLinearGradient(0, 0, 1400, 420); g.addColorStop(0, c1); g.addColorStop(1, c2); x.fillStyle = g; x.fillRect(0, 0, 1400, 420);
  x.globalAlpha = 0.12; x.fillStyle = '#fff'; for (let i = 0; i < 7; i++) { x.beginPath(); x.arc(200 + i * 190, 420, 120 + i * 26, 0, Math.PI * 2); x.fill(); }
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85));
  return Img.agregar(new File([blob], 'frase.jpg', { type: 'image/jpeg' }));
}

  await DB.abrir();
  try { await Img.cargar(); const e = await DB.leerEstado(); if (e) S = fusionar(e); }
  catch (err) { console.error(err); toast('No se pudieron leer los datos guardados: ' + err.message, 'err'); }
  // Filtros recordados de la sesión anterior
  try {   // sólo se aceptan claves conocidas y del mismo tipo (texto o casilla)
    const u = JSON.parse(localStorage.getItem('nova_ui') || 'null') || {};
    const copiar = (dest, org) => { for (const k of Object.keys(dest)) if (Object.hasOwn(org, k) && ['string', 'boolean'].includes(typeof dest[k]) && typeof org[k] === typeof dest[k] && String(org[k]).length <= 64 && /^[\w-]*$/.test(String(org[k]))) dest[k] = org[k]; };
    for (const k of Object.keys(UI)) if (UI[k] && typeof UI[k] === 'object' && u[k] && typeof u[k] === 'object') copiar(UI[k], u[k]);
    if (u.ag && u.ag.ver && typeof u.ag.ver === 'object') copiar(UI.ag.ver, u.ag.ver);
  } catch (e) { /* se ignora */ }
  if (UI.notas.f !== 'todas' && UI.notas.f !== 'sin' && !por('proyectos', UI.notas.f)) UI.notas.f = 'todas';
  const ico = document.createElement('link'); ico.rel = 'icon'; ico.href = 'data:image/svg+xml,' + encodeURIComponent(LOGO.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ')); document.head.appendChild(ico);
  aplicarTema();
  window.addEventListener('hashchange', () => App.ruta());
  $('#archivo').addEventListener('change', e => Datos.archivo(e.target));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if ($('#visor').classList.contains('on')) $('#visor').classList.remove('on'); else if ($('#confirma').classList.contains('on')) cerrarConfirma(); else Modal.cerrar(); }
    if (Boveda.abierta()) Boveda._temporizador();
  });
  document.addEventListener('click', () => { if (Boveda.abierta()) Boveda._temporizador(); });
  App.ruta();
  Rec.revisar(); setInterval(() => Rec.revisar(), 30000);
  // Si la plataforma queda abierta de un día a otro, se actualiza sola
  let dia = hoyISO(); setInterval(() => { if (hoyISO() !== dia) { dia = hoyISO(); if (!$('#modal').classList.contains('on') && App.vista !== 'notas') App.pintar(); } }, 60000);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});   // pide al navegador no borrar los datos
}
iniciar();

</script>
